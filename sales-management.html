<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直売所売上管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px 40px; }
  .top-nav { text-align: left; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #F0DEB8; color: #8A5A2A;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 16px; margin-bottom: 14px; }

  .tabs { display: flex; border: 1px solid #D6CBAA; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 9px 4px; border: none; background: #F7F3E9; color: #7A7256; font-family: inherit; font-size: 11px; cursor: pointer; }
  .tab-btn.active { background: #2E3B22; color: #fff; font-weight: 700; }

  .store-block { border: 1px solid #D6CBAA; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .store-name { font-size: 14px; font-weight: 700; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .store-name .report-time { font-size: 11px; font-weight: 400; color: #7A7256; }
  .item-row { display: flex; justify-content: space-between; font-size: 12px; color: #6B6048; padding: 3px 0; }
  .monthly-store-label { font-size: 13px; font-weight: 700; color: #2E3B22; margin: 14px 0 4px; padding-bottom: 4px; border-bottom: 1px solid #D6CBAA; }
  .monthly-store-label:first-child { margin-top: 0; }
  .monthly-grand-total { font-size: 14px; font-weight: 700; color: #2E3B22; margin-top: 16px; padding-top: 12px; border-top: 2px solid #2E3B22; text-align: right; }
  .store-total { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; padding-top: 6px; margin-top: 6px; border-top: 1px dashed #D6CBAA; }

  .select-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .section-divider { font-size: 12px; font-weight: 700; color: #7A7256; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid #D6CBAA; }
  .crop-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #D6CBAA; font-size: 14px; font-weight: 700; color: #2E3B22; }
  .crop-row-muted { color: #A69B7A; font-weight: 500; }
  .crop-row-total { border-bottom: none; border-top: 2px solid #2E3B22; margin-top: 4px; padding-top: 14px; font-size: 16px; }
  .store-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .history-mode-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .history-mode-btn { flex: 1; padding: 8px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 12px; cursor: pointer; }
  .history-mode-btn.active { background: #2E3B22; border-color: #2E3B22; color: #fff; font-weight: 700; }
  .store-tab-btn {
    flex: 1; min-width: 0; padding: 9px 4px; border: 1px solid #D6CBAA; border-radius: 8px;
    background: #F7F3E9; color: #6B6048; font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .store-tab-btn.active { background: #8A5A2A; border-color: #8A5A2A; color: #fff; font-weight: 700; }
  .store-tab-amount { display: block; font-size: 10px; font-weight: 400; margin-top: 2px; opacity: 0.85; }
  .select-row select { flex: 1; min-width: 0; padding: 10px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; }

  .report-block { border: 1px solid #D6CBAA; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .report-time-label { font-size: 12px; font-weight: 700; color: #3D5A75; margin: 0 0 4px; }
  .stock-hint { font-size: 11px; font-weight: 400; color: #8A5A2A; }

  .history-block { border-bottom: 1px solid #D6CBAA; padding: 8px 0; }
  .history-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; padding: 0 4px 4px; }
  .history-items { padding: 0 4px; }
  .stock-row { border: 1px solid #D6CBAA; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .stock-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .stock-variety { font-size: 13px; font-weight: 700; }
  .stock-crop { font-size: 11px; color: #7A7256; }
  .stock-remaining { font-size: 16px; font-weight: 700; }
  .stock-remaining.low { color: #8B3A2E; }
  .stock-sub { font-size: 11px; color: #7A7256; }
  .history-date { font-weight: 700; }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }
  .status.loading { background: #4A4436; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav" style="display:flex; align-items:center; gap:10px;">
    <div id="navHamburgerSlot"></div>
    <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a>
  </div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-shopping-cart" aria-hidden="true"></i></span>直売所売上管理</h1>

  <div id="blockedCard" class="card" style="text-align:center; display:none;">
    <p style="font-weight:700; color:#8B3A2E;">この画面は管理者のみ利用できます</p>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" id="tabProgressBtn" onclick="switchTab('progress')">本日の売上</button>
      <button class="tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">日別推移</button>
      <button class="tab-btn" id="tabMonthlyBtn" onclick="switchTab('monthly')">月別集計</button>
      <button class="tab-btn" id="tabStockBtn" onclick="switchTab('stock')">在庫管理</button>
    </div>

    <div id="monthlyView" class="card" style="display:none;">
      <div class="select-row">
        <select id="monthlySelect" onchange="loadMonthlySummary()"></select>
      </div>
      <div id="monthlySummaryList">読み込み中...</div>
    </div>

    <div id="progressView" class="card">
      <div id="todayView"></div>
      <p class="section-divider">途中経過</p>
      <div class="select-row">
        <select id="progressDateSelect" onchange="onProgressDateChange()"></select>
      </div>
      <div class="store-tabs" id="progressStoreTabs"></div>
      <div id="progressList">店舗と日付を選んでください</div>
    </div>

    <div id="historyView" class="card" style="display:none;">
      <div class="history-mode-toggle">
        <button class="history-mode-btn active" id="historyModeStoreBtn" onclick="switchHistoryMode('store')">店舗別</button>
        <button class="history-mode-btn" id="historyModeCropBtn" onclick="switchHistoryMode('crop')">品目別</button>
      </div>
      <div class="store-tabs" id="historyStoreTabs"></div>
      <div class="store-tabs" id="historyCropTabs" style="display:none;"></div>
      <div class="store-tabs" id="historyCropStoreFilter" style="display:none;"></div>
      <div id="historyList">店舗を選んでください</div>
    </div>

    <div id="stockView" class="card" style="display:none;">
      <p style="font-size:12px; font-weight:700; color:#6B6048; margin:0 0 8px;">入荷を登録する</p>
      <div class="select-row">
        <select id="stockStoreSelect"></select>
      </div>
      <div class="select-row">
        <select id="stockCropSelect" onchange="onCropChange()"></select>
        <select id="stockVarietySelect"></select>
      </div>
      <div class="select-row">
        <input type="number" id="stockQtyInput" placeholder="入荷数量" min="1" style="flex:1; min-width:0; padding:10px; font-size:13px; border-radius:8px; border:1px solid #D6CBAA; font-family:inherit;">
        <button onclick="submitStock()" id="stockSubmitBtn" style="flex-shrink:0; white-space:nowrap; padding:0 16px; border:none; border-radius:8px; background:#2E3B22; color:#fff; font-family:inherit; font-size:13px; cursor:pointer;">登録</button>
      </div>
      <p style="font-size:12px; font-weight:700; color:#6B6048; margin:16px 0 8px;">本日の在庫状況</p>
      <div id="stockStatusList">読み込み中...</div>
    </div>
  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">処理中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.23</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;
initNavDrawer('sales-management.html');
var currentTab = 'progress';
var progressInit = false;
var historyInit = false;
var stockInit = false;
var varietyByCrop = {};
var STORES = ['道の駅しらね', 'い～なとうぶ竜王店', 'い～なとうぶ昭和店'];

// ホーム画面の「本日の売上」タップから来た場合、指定の店舗・日付で途中経過タブを自動的に開く
function applyUrlParams() {
  var params = new URLSearchParams(window.location.search);
  var tab = params.get('tab');
  var store = params.get('store');
  var date = params.get('date');

  if (tab === 'history' || tab === 'monthly' || tab === 'stock') {
    switchTab(tab);
    return;
  }
  if (tab !== 'progress') return;

  switchTab('progress');
  if (!progressInit) initProgressTab();
  setTimeout(function () {
    if (store && STORES.indexOf(store) !== -1) {
      progressStore = store;
      setActiveStoreTab('progressStoreTabs', store);
    }
    if (date) document.getElementById('progressDateSelect').value = date;
    updateStoreTabAmounts('progressStoreTabs', document.getElementById('progressDateSelect').value);
    loadProgress();
  }, 0);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabProgressBtn').classList.toggle('active', tab === 'progress');
  document.getElementById('tabHistoryBtn').classList.toggle('active', tab === 'history');
  document.getElementById('tabMonthlyBtn').classList.toggle('active', tab === 'monthly');
  document.getElementById('tabStockBtn').classList.toggle('active', tab === 'stock');
  document.getElementById('progressView').style.display = (tab === 'progress') ? 'block' : 'none';
  document.getElementById('historyView').style.display = (tab === 'history') ? 'block' : 'none';
  document.getElementById('monthlyView').style.display = (tab === 'monthly') ? 'block' : 'none';
  document.getElementById('stockView').style.display = (tab === 'stock') ? 'block' : 'none';
  if (tab === 'progress') {
    loadTodayDetail();
    if (!progressInit) initProgressTab();
  }
  if (tab === 'history' && !historyInit) initHistoryTab();
  if (tab === 'monthly' && !monthlyInit) initMonthlyTab();
  if (tab === 'stock' && !stockInit) initStockTab();
}

var monthlyInit = false;
function initMonthlyTab() {
  monthlyInit = true;
  var sel = document.getElementById('monthlySelect');
  var now = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    var opt = document.createElement('option');
    opt.value = ym;
    opt.textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
    sel.appendChild(opt);
  }
  loadMonthlySummary();
}

function loadMonthlySummary() {
  var yearMonth = document.getElementById('monthlySelect').value;
  var el = document.getElementById('monthlySummaryList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">集計中...</p>';

  callServer({ action: 'getMonthlySalesByStoreAndCrop', userId: profile.userId, yearMonth: yearMonth }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
      return;
    }
    if (result.stores.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">この月のデータがありません。</p>';
      return;
    }
    var html = '';
    result.stores.forEach(function (s) {
      html += '<p class="monthly-store-label">' + s.store + '（' + s.totalCount + '件　¥' + s.totalAmount.toLocaleString() + '）</p>';
      s.crops.forEach(function (c) {
        html += '<div class="item-row"><span>' + c.crop + '</span><span>' + c.count + '件　¥' + c.amount.toLocaleString() + '</span></div>';
      });
    });
    html += '<div class="monthly-grand-total">全店合計：' + result.grandCount + '件　¥' + result.grandAmount.toLocaleString() + '</div>';
    el.innerHTML = html;
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function loadTodayDetail() {
  var el = document.getElementById('todayView');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getTodaySalesDetail', userId: profile.userId }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
      return;
    }
    el.innerHTML = '<p style="font-size:12px; color:#7A7256; margin:0 0 10px;">' + result.today + '</p>';

    STORES.forEach(function (store) {
      var s = result.stores[store];
      var block = document.createElement('div');
      block.className = 'store-block';

      var timeLabel = s.reportTime ? s.reportTime + '時点' : '本日の報告なし';
      var itemsHtml = s.items.length === 0
        ? '<p style="font-size:12px; color:#A69B7A; margin:0;">記録なし</p>'
        : s.items.map(function (it) {
            return '<div class="item-row"><span>' + it.item + '（' + it.qty + '）</span><span>¥' + it.amount.toLocaleString() + '</span></div>';
          }).join('');

      block.innerHTML =
        '<p class="store-name">' + store + '<span class="report-time">' + timeLabel + '</span></p>' +
        itemsHtml +
        '<div class="store-total"><span>合計</span><span>¥' + s.total.toLocaleString() + '</span></div>';
      el.appendChild(block);
    });
  });
}

var progressStore = null;

function initProgressTab() {
  progressInit = true;
  if (!progressStore) progressStore = STORES[0];

  var dateSel = document.getElementById('progressDateSelect');
  var now = new Date();
  for (var i = 0; i < 31; i++) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    var ds = Utilities_formatDate(d);
    var opt2 = document.createElement('option');
    opt2.value = ds;
    opt2.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    dateSel.appendChild(opt2);
  }

  renderStoreTabs('progressStoreTabs', function (store) {
    progressStore = store;
    loadProgress();
  }, true);
  setActiveStoreTab('progressStoreTabs', progressStore);
  updateStoreTabAmounts('progressStoreTabs', dateSel.value);
  loadProgress();
}

function onProgressDateChange() {
  var date = document.getElementById('progressDateSelect').value;
  updateStoreTabAmounts('progressStoreTabs', date);
  loadProgress();
}

// 店舗タブを描画する共通関数。showAmountsがtrueなら、各タブの下に日付・金額を表示する
function renderStoreTabs(containerId, onSelect, showAmounts) {
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  STORES.forEach(function (store) {
    var btn = document.createElement('button');
    btn.className = 'store-tab-btn';
    btn.dataset.store = store;
    btn.innerHTML = store + (showAmounts ? '<span class="store-tab-amount">読み込み中...</span>' : '');
    btn.onclick = function () {
      setActiveStoreTab(containerId, store);
      onSelect(store);
    };
    container.appendChild(btn);
  });
}

// 指定した日付の、各店舗タブの金額表示を更新する
function updateStoreTabAmounts(containerId, date) {
  var container = document.getElementById(containerId);
  callServer({ action: 'getDailyTotalsForAllStores', userId: profile.userId, date: date }).then(function (result) {
    if (result.status !== 'ok') return;
    var parts = date.split('-');
    var label = Number(parts[1]) + '/' + Number(parts[2]);
    Array.prototype.forEach.call(container.children, function (btn) {
      var span = btn.querySelector('.store-tab-amount');
      if (!span) return;
      var amount = result.totals[btn.dataset.store] || 0;
      span.textContent = label + '　¥' + amount.toLocaleString();
    });
  }).catch(function () {
    Array.prototype.forEach.call(container.children, function (btn) {
      var span = btn.querySelector('.store-tab-amount');
      if (span) span.textContent = '取得失敗';
    });
  });
}

function setActiveStoreTab(containerId, store) {
  var container = document.getElementById(containerId);
  Array.prototype.forEach.call(container.children, function (btn) {
    btn.classList.toggle('active', btn.dataset.store === store);
  });
}

function Utilities_formatDate(d) {
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

function loadProgress() {
  var store = progressStore;
  var date = document.getElementById('progressDateSelect').value;
  var el = document.getElementById('progressList');
  if (!store || !date) return;
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getIntradayProgress', userId: profile.userId, store: store, date: date }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
      return;
    }
    if (result.reports.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">この日の報告はまだありません。</p>';
      return;
    }
    el.innerHTML = '';
    result.reports.forEach(function (r) {
      var block = document.createElement('div');
      block.className = 'report-block';
      var itemsHtml = r.items.map(function (it) {
        return '<div class="item-row"><span>' + it.item + '（' + it.qty + '）</span><span>¥' + it.amount.toLocaleString() + '</span></div>';
      }).join('');
      var stockHtml = (r.stockSummary && r.stockSummary.length > 0)
        ? ' <span class="stock-hint">' + r.stockSummary.map(function (s) { return s.variety + '残り' + s.remaining + '個'; }).join('　') + '</span>'
        : '';
      block.innerHTML =
        '<p class="report-time-label">' + r.time + ' 時点' + stockHtml + '</p>' +
        itemsHtml +
        '<div class="store-total"><span>合計</span><span>¥' + r.total.toLocaleString() + '</span></div>';
      el.appendChild(block);
    });
  });
}

function initStockTab() {
  stockInit = true;

  var storeSel = document.getElementById('stockStoreSelect');
  STORES.forEach(function (s) {
    var opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    storeSel.appendChild(opt);
  });

  callServer({ action: 'getVarietyList', userId: profile.userId }).then(function (result) {
    if (result.status !== 'ok') {
      alert('品種一覧の取得に失敗しました：' + (result.message || '不明なエラー'));
      return;
    }
    varietyByCrop = result.byCrop;
    var cropSel = document.getElementById('stockCropSelect');
    result.crops.forEach(function (crop) {
      var opt = document.createElement('option');
      opt.value = crop;
      opt.textContent = crop;
      cropSel.appendChild(opt);
    });
    onCropChange();
  }).catch(function (err) {
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });

  loadStockStatus();
}

function onCropChange() {
  var crop = document.getElementById('stockCropSelect').value;
  var varietySel = document.getElementById('stockVarietySelect');
  varietySel.innerHTML = '';
  (varietyByCrop[crop] || []).forEach(function (v) {
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    varietySel.appendChild(opt);
  });
}

function submitStock() {
  var store = document.getElementById('stockStoreSelect').value;
  var variety = document.getElementById('stockVarietySelect').value;
  var qty = document.getElementById('stockQtyInput').value;
  if (!store || !variety || !qty) {
    alert('店舗と品種と数量を入力してください。');
    return;
  }
  var ok = confirm(store + 'に「' + variety + '」を' + qty + '個、入荷登録します。\nよろしいですか？');
  if (!ok) return;

  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

  showProcessing('登録中...');

  callServer({ action: 'submitStockEntry', userId: profile.userId, date: todayStr, store: store, variety: variety, qty: qty }).then(function (result) {
    hideProcessing();
    if (result.status === 'ok') {
      document.getElementById('stockQtyInput').value = '';
      loadStockStatus();
    } else {
      alert(result.message);
    }
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function loadStockStatus() {
  var el = document.getElementById('stockStatusList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getStockStatus', userId: profile.userId }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
      return;
    }
    if (result.items.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">本日はまだ入荷・販売の記録がありません。</p>';
      return;
    }
    el.innerHTML = '';
    var currentStore = null;
    result.items.forEach(function (it) {
      if (it.store !== currentStore) {
        currentStore = it.store;
        var storeHeader = document.createElement('p');
        storeHeader.style.cssText = 'font-size:12px; font-weight:700; color:#3D5A75; margin:10px 0 6px;';
        storeHeader.textContent = currentStore;
        el.appendChild(storeHeader);
      }
      var row = document.createElement('div');
      row.className = 'stock-row';
      var lowClass = it.remaining <= 0 ? ' low' : '';
      row.innerHTML =
        '<div class="stock-row-top"><span class="stock-variety">' + it.variety + '<span class="stock-crop">（' + it.crop + '）</span></span>' +
        '<span class="stock-remaining' + lowClass + '">残り' + it.remaining + '個</span></div>' +
        '<div class="stock-sub">入荷' + it.incoming + '個　－　販売' + it.sold + '個</div>';
      el.appendChild(row);
    });
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

var historyStore = null;
var historyCrop = null;
var historyCropStoreFilter = null;
var historyMode = 'store';
var historyCropInit = false;
var HISTORY_CROPS = ['さくらんぼ', 'もも', 'スモモ', '葡萄', '柿'];

function switchHistoryMode(mode) {
  historyMode = mode;
  document.getElementById('historyModeStoreBtn').classList.toggle('active', mode === 'store');
  document.getElementById('historyModeCropBtn').classList.toggle('active', mode === 'crop');
  document.getElementById('historyStoreTabs').style.display = (mode === 'store') ? 'flex' : 'none';
  document.getElementById('historyCropTabs').style.display = (mode === 'crop') ? 'flex' : 'none';
  document.getElementById('historyCropStoreFilter').style.display = (mode === 'crop') ? 'flex' : 'none';

  if (mode === 'crop' && !historyCropInit) {
    historyCropInit = true;
    if (!historyCrop) historyCrop = HISTORY_CROPS[0];
    if (!historyCropStoreFilter) historyCropStoreFilter = 'すべて';
    renderCropTabsForHistory();
    renderCropStoreFilter();
  }
  loadDailyHistory();
}

function renderCropStoreFilter() {
  var container = document.getElementById('historyCropStoreFilter');
  container.innerHTML = '';
  ['すべて'].concat(STORES).forEach(function (store) {
    var btn = document.createElement('button');
    btn.className = 'store-tab-btn' + (store === historyCropStoreFilter ? ' active' : '');
    btn.textContent = store;
    btn.onclick = function () {
      historyCropStoreFilter = store;
      Array.prototype.forEach.call(container.children, function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadDailyHistory();
    };
    container.appendChild(btn);
  });
}

function renderCropTabsForHistory() {
  var container = document.getElementById('historyCropTabs');
  container.innerHTML = '';
  HISTORY_CROPS.forEach(function (crop) {
    var btn = document.createElement('button');
    btn.className = 'store-tab-btn' + (crop === historyCrop ? ' active' : '');
    btn.textContent = crop;
    btn.onclick = function () {
      historyCrop = crop;
      Array.prototype.forEach.call(container.children, function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadDailyHistory();
    };
    container.appendChild(btn);
  });
}

function initHistoryTab() {
  historyInit = true;
  if (!historyStore) historyStore = STORES[0];
  renderStoreTabs('historyStoreTabs', function (store) {
    historyStore = store;
    loadDailyHistory();
  });
  setActiveStoreTab('historyStoreTabs', historyStore);
  loadDailyHistory();
}

function loadDailyHistory() {
  var el = document.getElementById('historyList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  if (historyMode === 'crop') {
    if (!historyCrop) return;
    callServer({ action: 'getDailyCropHistory', userId: profile.userId, crop: historyCrop, store: historyCropStoreFilter }).then(function (result) {
      if (result.status !== 'ok') {
        el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
        return;
      }
      if (result.rows.length === 0) {
        el.innerHTML = '<p style="font-size:13px; color:#7A7256;">まだデータがありません。</p>';
        return;
      }
      el.innerHTML = '';
      result.rows.forEach(function (r) {
        var parts = r.date.split('-');
        var label = Number(parts[1]) + '月' + Number(parts[2]) + '日';
        var block = document.createElement('div');
        block.className = 'history-block';
        var itemsHtml = r.items.map(function (it) {
          return '<div class="item-row"><span>' + it.store + '・' + it.item + '</span><span>¥' + it.amount.toLocaleString() + '</span></div>';
        }).join('');
        block.innerHTML =
          '<div class="history-row"><span class="history-date">' + label + '</span><span>¥' + r.amount.toLocaleString() + '</span></div>' +
          '<div class="history-items">' + itemsHtml + '</div>';
        el.appendChild(block);
      });
    }).catch(function (err) {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
    });
    return;
  }

  var store = historyStore;
  if (!store) return;

  callServer({ action: 'getDailyHistory', userId: profile.userId, store: store }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#8B3A2E;">' + result.message + '</p>';
      return;
    }
    if (result.rows.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">まだデータがありません。</p>';
      return;
    }
    el.innerHTML = '';
    result.rows.forEach(function (r) {
      var parts = r.date.split('-');
      var label = Number(parts[1]) + '月' + Number(parts[2]) + '日';
      var block = document.createElement('div');
      block.className = 'history-block';

      var itemsHtml = r.items.map(function (it) {
        return '<div class="item-row"><span>' + it.item + '（' + it.qty + '）</span><span>¥' + it.amount.toLocaleString() + '</span></div>';
      }).join('');

      block.innerHTML =
        '<div class="history-row"><span class="history-date">' + label + '</span><span>¥' + r.total.toLocaleString() + '</span></div>' +
        '<div class="history-items">' + itemsHtml + '</div>';
      el.appendChild(block);
    });
  });
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    return callServer({ action: 'checkAdmin', userId: p.userId });
  }).then(function (result) {
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    if (result.status === 'ok') {
      document.getElementById('mainContent').style.display = 'block';
      loadTodayDetail();
      if (!progressInit) initProgressTab();
      applyUrlParams();
    } else {
      document.getElementById('blockedCard').style.display = 'block';
    }
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
</body>
</html>
