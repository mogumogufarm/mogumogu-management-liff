<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約販売数ディスプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #1A1610;
  }
  #startOverlay {
    position: fixed; inset: 0; background: #2E3B22; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 999; cursor: pointer;
  }
  #startOverlay p { color: #F7F3E9; font-size: 3vw; font-weight: 700; }
  #startOverlay span { color: #D6CBAA; font-size: 1.5vw; margin-top: 1vw; }

  #display {
    width: 100vw; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 3vw;
  }
  #titleText {
    color: #F7F3E9; font-size: 4.5vw; font-weight: 900; letter-spacing: 0.3vw;
    margin-bottom: 3vw; text-align: center;
  }
  #cardsRow { display: flex; gap: 2.5vw; width: 100%; justify-content: center; }
  .disp-card {
    background: #F7F3E9; border: 0.5vw solid #2E3B22; border-radius: 2vw;
    padding: 2.5vw 2vw; text-align: center; flex: 1; max-width: 30vw;
  }
  .disp-card-name { color: #6B6048; font-size: 2vw; font-weight: 700; margin-bottom: 1vw; }
  .disp-card-kg-big { color: #8B3A2E; font-size: 8vw; font-weight: 900; line-height: 1; }
  .disp-card-kg-big span { font-size: 2.5vw; font-weight: 700; }
  .disp-card-count { color: #6B6048; font-size: 2vw; margin: 1vw 0; }
  .disp-card-amount { color: #2E3B22; font-size: 3vw; font-weight: 900; }
  .disp-card-diff { color: #3E5A1F; font-size: 1.8vw; font-weight: 700; margin-top: 1vw; }
  .disp-card-wakeari { color: #8A5A2A; font-size: 1.3vw; margin-top: 1.5vw; padding-top: 1vw; border-top: 0.15vw dashed #D6CBAA; }
  #updatedAt { color: #A69B7A; font-size: 1.3vw; margin-top: 2.5vw; }
  #flashOverlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 500;
    display: none; align-items: center; justify-content: center;
  }
  #flashOverlay p { color: #8B3A2E; font-size: 6vw; font-weight: 900; }
  #flashOverlay.show { display: flex; animation: flashPulse 10s ease; }
  @keyframes flashPulse { 0% { opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div id="startOverlay" onclick="startDisplay()">
  <p>タップして開始</p>
  <span>（音を鳴らすために、最初に1回だけ画面に触れてください）</span>
</div>

<div id="display" style="display:none;">
  <p id="titleText">読み込み中...</p>
  <div id="cardsRow"></div>
  <p id="updatedAt"></p>
</div>

<div id="flashOverlay"><p id="flashText">新しい注文が入りました！</p></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';
var currentUserId = null;
var currentIdToken = null;
var lastCounts = {};
var audioCtx = null;

function callServer(payload) {
  payload.idToken = currentIdToken;
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function (res) { return res.json(); });
}

function startDisplay() {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('display').style.display = 'flex';
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  initLiff();
}

// Web Audio APIで、外部音声ファイルを使わずに簡単なチャイム音を鳴らす
function playTone(freq, start, dur, type, vol) {
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(vol || 0.3, start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + dur);
}

// ゲーム風レベルアップ音（ピコピコ上昇していく、達成感のあるタイプ）
function playChime() {
  if (!audioCtx) return;
  var now = audioCtx.currentTime;
  [262, 330, 392, 440, 523, 659, 784, 880, 1046].forEach(function (freq, i) {
    playTone(freq, now + i * 0.13, 0.18, 'square', 0.12);
  });
  playTone(1318, now + 1.3, 3.2, 'square', 0.14);
  playTone(1568, now + 1.3, 3.2, 'square', 0.10);
}

function initLiff() {
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    currentUserId = p.userId;
    currentIdToken = liff.getIDToken();
    loadAndShow();
    setInterval(loadAndShow, 60 * 1000); // 1分おきに自動更新
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    document.getElementById('titleText').textContent = '読み込みエラー：' + (err && err.message ? err.message : err);
  });
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(function (_, reject) { setTimeout(function () { reject(new Error('TIMEOUT')); }, ms); })
  ]);
}

function loadAndShow() {
  var year = new Date().getFullYear();
  callServer({ action: 'getSanchokuVarietySummary', userId: currentUserId, year: String(year) }).then(function (result) {
    if (result.status !== 'ok') {
      document.getElementById('titleText').textContent = result.message;
      return;
    }
    document.getElementById('titleText').textContent = year + '年　予約販売数';

    var totalCountNow = 0;
    var isFirstLoad = Object.keys(lastCounts).length === 0;
    var increased = false;

    var html = '';
    result.varieties.forEach(function (v) {
      var s = result.summary[v];
      totalCountNow += s.count;
      if (!isFirstLoad && (lastCounts[v] === undefined || s.count > lastCounts[v])) increased = true;
      lastCounts[v] = s.count;

      html += '<div class="disp-card">' +
        '<p class="disp-card-name">' + v + '</p>' +
        '<p class="disp-card-kg-big">' + s.weightKg.toLocaleString() + '<span>kg</span></p>' +
        '<p class="disp-card-count">' + s.count + '点</p>' +
        '<p class="disp-card-amount">￥' + s.amount.toLocaleString() + '</p>' +
        '<p class="disp-card-diff">前日＋' + s.todayCount + '件</p>';
      if (s.wakeariCount > 0) {
        html += '<p class="disp-card-wakeari">うち訳あり・家庭用：' + s.wakeariCount + '件　' + s.wakeariWeightKg.toLocaleString() + 'kg　￥' + s.wakeariAmount.toLocaleString() + '</p>';
      }
      html += '</div>';
    });
    document.getElementById('cardsRow').innerHTML = html;

    var now = new Date();
    document.getElementById('updatedAt').textContent = '更新：' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');

    if (increased) {
      playChime();
      var flash = document.getElementById('flashOverlay');
      flash.classList.remove('show');
      void flash.offsetWidth;
      flash.classList.add('show');
      clearTimeout(window.__flashHideTimer);
      window.__flashHideTimer = setTimeout(function () {
        flash.classList.remove('show');
      }, 10000);
    }
  }).catch(function (err) {
    document.getElementById('titleText').textContent = '通信エラー：' + (err && err.message ? err.message : err);
  });
}
</script>
</body>
</html>
