<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約販売数ディスプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #000;
  }
  #startOverlay {
    position: fixed; inset: 0; background: #2E3B22; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 999; cursor: pointer;
  }
  #startOverlay p { color: #F7F3E9; font-size: 3vw; font-weight: 700; }
  #startOverlay span { color: #D6CBAA; font-size: 1.5vw; margin-top: 1vw; }

  #display {
    width: 100vw; height: 100vh; background: #000; padding: 1.2vw;
    display: flex; gap: 1.2vw;
  }
  #leftCol { flex: 1; display: flex; flex-direction: column; gap: 0.8vw; min-width: 0; overflow: hidden; }
  .section-label { color: #A69B7A; font-size: 1.1vw; font-weight: 700; margin: 0.2vw 0 0.3vw 0.3vw; }
  .cards-row { display: flex; gap: 0.8vw; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
  .disp-card {
    flex: 1; background: #F7F3E9; border: 0.25vw solid #2E3B22; border-radius: 1.2vw;
    display: flex; align-items: center; padding: 0 1.4vw; gap: 1vw; min-height: 0; min-width: 0; overflow: hidden;
  }
  .disp-card-name {
    font-size: 1.3vw; font-weight: 700; color: #3E5A1F; background: #E3ECD3; border-radius: 0.7vw;
    width: 7vw; flex-shrink: 0; text-align: center; padding: 0.6vw 0.2vw; line-height: 1.25;
  }
  .disp-card-kg { font-size: 6vw; font-weight: 900; color: #8B3A2E; line-height: 1; white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; }
  .disp-card-kg span { font-size: 1.9vw; font-weight: 700; }
  .disp-card-right { margin-left: auto; text-align: right; flex-shrink: 0; }
  .disp-card-count { font-size: 1.8vw; color: #2E3B22; margin-bottom: 0.3vw; }
  .disp-card-amount { font-size: 2.1vw; font-weight: 700; color: #8B3A2E; }
  .disp-card-diff { font-size: 1.2vw; color: #3E5A1F; font-weight: 700; margin-top: 0.4vw; white-space: nowrap; }

  /* 直売所・総合計用のコンパクトなカード */
  .mini-card {
    flex: 1; background: #F7F3E9; border: 0.2vw solid #2E3B22; border-radius: 1vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.6vw;
  }
  .mini-card-name { font-size: 1.1vw; font-weight: 700; color: #3E5A1F; margin: 0; }
  .mini-card-kg { font-size: 3vw; font-weight: 900; color: #8B3A2E; line-height: 1.1; margin: 0.2vw 0; }
  .mini-card-kg span { font-size: 1.3vw; }
  .mini-card-sub { font-size: 1.1vw; color: #2E3B22; margin: 0; }
  .grand-total-card {
    flex: 1; background: #2E3B22; border-radius: 1vw; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0.6vw;
  }
  .grand-total-card .mini-card-name { color: #D6CBAA; }
  .grand-total-card .mini-card-kg { color: #FFE9A8; }
  .grand-total-card .mini-card-sub { color: #F7F3E9; }

  #rightCol {
    width: 32%; background: #111; border-radius: 1.4vw; padding: 1.6vw; overflow: hidden;
    display: flex; flex-direction: column;
  }
  #rightCol h2 { color: #F7F3E9; font-size: 1.6vw; font-weight: 700; text-align: center; margin-bottom: 1.2vw; }
  #orderLogList { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0.9vw; }
  .order-log-item {
    color: #F7F3E9; font-size: 1.35vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .order-log-item .order-log-site { color: #8FBF6A; }
  .order-log-item .order-log-time { color: #A69B7A; margin-right: 0.5vw; }

  #flashOverlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 500;
    display: none; align-items: center; justify-content: center;
  }
  #flashOverlay p { color: #8B3A2E; font-size: 6vw; font-weight: 900; }
  #flashOverlay.show { display: flex; animation: flashPulse 10s ease; }
  @keyframes flashPulse { 0% { opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div id="startOverlay" onclick="startDisplay()">
  <p>タップして開始</p>
  <span>（音を鳴らすために、最初に1回だけ画面に触れてください）</span>
</div>

<div id="display" style="display:none;">
  <div id="leftCol">
    <p class="section-label">産直サイト・直売注文</p>
    <div class="cards-row" id="sanchokuCardsRow"></div>
    <p class="section-label">直売所（道の駅・い～なとうぶ）</p>
    <div class="cards-row" id="chokubaiCardsRow" style="flex:0.55;"></div>
    <p class="section-label">総合計</p>
    <div class="cards-row" id="grandTotalCardsRow" style="flex:0.55;"></div>
  </div>
  <div id="rightCol">
    <h2>📋 注文ログ</h2>
    <div id="orderLogList"></div>
    <p id="orderLogUpdatedAt" style="text-align:center; font-size:1vw; color:#6B6048; margin-top:1vw; border-top:0.1vw solid rgba(255,255,255,0.15); padding-top:0.8vw;"></p>
  </div>
</div>

<div id="flashOverlay"><p id="flashText">新しい注文が入りました！</p></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';
var currentUserId = null;
var currentIdToken = null;
var lastCounts = {};
var audioCtx = null;

function callServer(payload, retriesLeft) {
  if (retriesLeft === undefined) retriesLeft = 2;
  payload.idToken = currentIdToken;
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function (res) { return res.text(); }).then(function (text) {
    try {
      return JSON.parse(text);
    } catch (e) {
      // GASの起動が遅い時など、JSONではない応答が返ってくることがあるため、少し待って再試行する
      if (retriesLeft > 0) {
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(callServer(payload, retriesLeft - 1)); }, 4000);
        });
      }
      throw new Error('サーバーの応答が正しく読み取れませんでした（しばらくすると復旧することがあります）');
    }
  });
}

function startDisplay() {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('display').style.display = 'flex';
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  initLiff();
}

function playTone(freq, start, dur, type, vol) {
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(vol || 0.3, start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + dur);
}

// ゲーム風レベルアップ音（ピコピコ上昇していく、達成感のあるタイプ）
function playChime() {
  if (!audioCtx) return;
  var now = audioCtx.currentTime;
  [262, 330, 392, 440, 523, 659, 784, 880, 1046].forEach(function (freq, i) {
    playTone(freq, now + i * 0.13, 0.18, 'square', 0.12);
  });
  playTone(1318, now + 1.3, 3.2, 'square', 0.14);
  playTone(1568, now + 1.3, 3.2, 'square', 0.10);
}

function initLiff() {
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    currentUserId = p.userId;
    currentIdToken = liff.getIDToken();
    loadAndShow();
    setInterval(loadAndShow, 60 * 1000); // 1分おきに自動更新
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    document.getElementById('leftCol').innerHTML = '<p style="color:#fff;">読み込みエラー：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(function (_, reject) { setTimeout(function () { reject(new Error('TIMEOUT')); }, ms); })
  ]);
}

var lastSanchokuSummary = null;
var lastChokubaiSummary = null;

function loadAndShow() {
  var year = new Date().getFullYear();

  var sanchokuPromise = callServer({ action: 'getSanchokuVarietySummary', userId: currentUserId, year: String(year) });
  var chokubaiPromise = callServer({ action: 'getChokubaiSalesVarietySummary', userId: currentUserId, year: String(year) });

  Promise.all([sanchokuPromise, chokubaiPromise]).then(function (results) {
    var sanchokuResult = results[0];
    var chokubaiResult = results[1];

    if (sanchokuResult.status !== 'ok') {
      document.getElementById('sanchokuCardsRow').innerHTML = '<p style="color:#fff;">' + sanchokuResult.message + '</p>';
      return;
    }
    lastSanchokuSummary = sanchokuResult;

    var isFirstLoad = Object.keys(lastCounts).length === 0;
    var increased = false;

    var html = '';
    sanchokuResult.varieties.forEach(function (v) {
      var s = sanchokuResult.summary[v];
      if (!isFirstLoad && (lastCounts[v] === undefined || s.count > lastCounts[v])) increased = true;
      lastCounts[v] = s.count;

      html += '<div class="disp-card">' +
        '<p class="disp-card-name">' + v + '</p>' +
        '<p class="disp-card-kg">' + s.weightKg.toLocaleString() + '<span>kg</span></p>' +
        '<div class="disp-card-right">' +
        '<p class="disp-card-count">' + s.count + '点</p>' +
        '<p class="disp-card-amount">￥' + s.amount.toLocaleString() + '</p>' +
        '<p class="disp-card-diff">前日＋' + s.todayCount + '件　＋' + s.todayWeightKg.toLocaleString() + 'kg</p>' +
        '</div></div>';
    });
    document.getElementById('sanchokuCardsRow').innerHTML = html;

    if (chokubaiResult.status === 'ok') {
      lastChokubaiSummary = chokubaiResult;
      var cHtml = '';
      chokubaiResult.varieties.forEach(function (v) {
        var s = chokubaiResult.summary[v];
        cHtml += '<div class="mini-card">' +
          '<p class="mini-card-name">' + v + '</p>' +
          '<p class="mini-card-kg">' + s.weightKg.toLocaleString() + '<span>kg</span></p>' +
          '<p class="mini-card-sub">' + s.count + '点　￥' + s.amount.toLocaleString() + '</p>' +
          '</div>';
      });
      document.getElementById('chokubaiCardsRow').innerHTML = cHtml;
    }

    renderGrandTotal();

    if (increased) {
      playChime();
      var flash = document.getElementById('flashOverlay');
      flash.classList.remove('show');
      void flash.offsetWidth;
      flash.classList.add('show');
      clearTimeout(window.__flashHideTimer);
      window.__flashHideTimer = setTimeout(function () {
        flash.classList.remove('show');
      }, 10000);
    }
  }).catch(function (err) {
    document.getElementById('sanchokuCardsRow').innerHTML = '<p style="color:#fff;">通信エラー：' + (err && err.message ? err.message : err) + '</p>';
  });

  loadOrderLog();
}

function renderGrandTotal() {
  if (!lastSanchokuSummary) return;
  var varieties = lastSanchokuSummary.varieties;
  var grandAmount = 0;
  var html = '';
  varieties.forEach(function (v) {
    var s1 = lastSanchokuSummary.summary[v] || { weightKg: 0, count: 0, amount: 0 };
    var s2 = (lastChokubaiSummary && lastChokubaiSummary.summary[v]) || { weightKg: 0, count: 0, amount: 0 };
    var totalKg = Math.round((s1.weightKg + s2.weightKg) * 100) / 100;
    var totalCount = s1.count + s2.count;
    var totalAmount = s1.amount + s2.amount;
    grandAmount += totalAmount;
    html += '<div class="mini-card">' +
      '<p class="mini-card-name">' + v + '</p>' +
      '<p class="mini-card-kg">' + totalKg.toLocaleString() + '<span>kg</span></p>' +
      '<p class="mini-card-sub">' + totalCount + '点　￥' + totalAmount.toLocaleString() + '</p>' +
      '</div>';
  });
  html += '<div class="grand-total-card">' +
    '<p class="mini-card-name">全体合計</p>' +
    '<p class="mini-card-kg">￥' + grandAmount.toLocaleString() + '</p>' +
    '</div>';
  document.getElementById('grandTotalCardsRow').innerHTML = html;
}

function loadOrderLog() {
  callServer({ action: 'getRecentSanchokuOrders', userId: currentUserId, limit: 12 }).then(function (result) {
    if (result.status !== 'ok') return;
    var el = document.getElementById('orderLogList');
    var html = '';
    result.rows.forEach(function (r, idx) {
      html += '<p class="order-log-item" style="opacity:' + Math.max(1 - idx * 0.07, 0.35) + ';">' +
        '<span class="order-log-time">' + r.label + '</span>「' + r.item + '」<span class="order-log-site">(' + r.site + ')</span></p>';
    });
    el.innerHTML = html || '<p class="order-log-item" style="opacity:0.5;">まだ注文がありません</p>';
    var now = new Date();
    document.getElementById('orderLogUpdatedAt').textContent = '更新：' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  });
}
</script>
</body>
</html>
