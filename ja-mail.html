<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JA南アルプス指導メール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px 40px; }
  .top-nav { text-align: left; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #DCE6EA; color: #3D5A75;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }

  .ja-mail-row { padding: 12px 4px; border-bottom: 1px solid #D6CBAA; cursor: pointer; }
  .ja-mail-row:last-child { border-bottom: none; }
  .ja-mail-row:active { opacity: 0.6; }
  .ja-mail-date { font-size: 11px; color: #7A7256; margin: 0 0 3px; }
  .ja-mail-subject { font-size: 14px; font-weight: 700; color: #2E3B22; margin: 0; }
  .ja-mail-badge { display: inline-block; background: #F0DAD0; color: #8B3A2E; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; margin-right: 6px; vertical-align: middle; }
  .badge-boujo { background: #F0DAD0; color: #8B3A2E; }
  .badge-setsumei { background: #DCE6EA; color: #3D5A75; }
  .badge-mihon { background: #F0DEB8; color: #8A5A2A; }
  .badge-koushu { background: #E3ECD3; color: #3E5A1F; }
  .manual-form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .manual-form-row label { font-size: 12px; font-weight: 700; color: #6B6048; }
  .manual-form-row input, .manual-form-row textarea {
    padding: 8px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; width: 100%; resize: vertical;
  }
  .submit-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 2500; padding: 20px; }
  .modal-box { background: #F7F3E9; border-radius: 16px; padding: 20px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-title { font-size: 15px; font-weight: 700; color: #2E3B22; margin: 0 0 4px; }
  .modal-close-btn { width: 100%; margin-top: 16px; padding: 10px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 13px; cursor: pointer; }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav"><a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a></div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-mail" aria-hidden="true"></i></span>JA南アルプス指導メール</h1>

  <div id="blockedCard" class="card" style="text-align:center; display:none;">
    <p style="font-weight:700; color:#8B3A2E;">この画面は管理者のみ利用できます</p>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="card">
      <div id="jaMailList">読み込み中...</div>
    </div>
  </div>

  <div id="jaMailBodyModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeJaMailBodyModal();">
    <div class="modal-box">
      <p class="modal-title" id="jaMailBodyTitle"></p>
      <p style="font-size:11px; color:#7A7256; margin:0 0 12px;" id="jaMailBodyDate"></p>
      <p id="jaMailBodyText" style="font-size:13px; color:#2E3B22; white-space:pre-wrap; line-height:1.6;"></p>
      <button class="modal-close-btn" onclick="closeJaMailBodyModal()">閉じる</button>
    </div>
  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">処理中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.06</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;

// 件名に含まれるキーワードから、該当するバッジをすべて組み立てる
var JA_MAIL_BADGE_RULES = [
  { keywords: ['防除', '薬剤', '散布'], label: '防除', cls: 'badge-boujo' },
  { keywords: ['説明'], label: '出荷説明会', cls: 'badge-setsumei' },
  { keywords: ['見本', '熟度', '展示', 'サンプル', '目合わせ'], label: '熟度見本', cls: 'badge-mihon' },
  { keywords: ['講習会'], label: '講習会', cls: 'badge-koushu' }
];
var JA_MAIL_CROP_COLORS = {
  'さくらんぼ': { bg: '#F0DAD0', fg: '#8B3A2E' },
  'もも': { bg: '#F0DEB8', fg: '#8A5A2A' },
  'スモモ': { bg: '#EAE0E8', fg: '#6A4A5E' },
  '葡萄': { bg: '#E3ECD3', fg: '#3E5A1F' },
  '柿': { bg: '#F0DEB8', fg: '#8A5A2A' }
};

function buildJaMailBadges(subject) {
  var html = '';
  JA_MAIL_BADGE_RULES.forEach(function (rule) {
    var matched = rule.keywords.some(function (kw) { return subject.indexOf(kw) !== -1; });
    if (matched) html += '<span class="ja-mail-badge ' + rule.cls + '">' + rule.label + '</span>';
  });
  return html;
}

function loadJaMailList() {
  var el = document.getElementById('jaMailList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getJaMailList', userId: profile.userId, limit: 200 }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#C0392B;">' + result.message + '</p>';
      return;
    }
    if (result.mails.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">メールがありません。</p>';
      return;
    }
    el.innerHTML = '';
    result.mails.forEach(function (m) {
      var row = document.createElement('div');
      row.className = 'ja-mail-row';
      row.onclick = function () { openJaMailBody(m.id); };
      var badge = buildJaMailBadges(m.subject);
      var cropBadge = '';
      if (m.crop) {
        var cc = JA_MAIL_CROP_COLORS[m.crop] || { bg: '#E8E4DA', fg: '#6B6048' };
        cropBadge = '<span class="ja-mail-badge" style="background:' + cc.bg + ';color:' + cc.fg + ';">' + m.crop + '</span>';
      }
      row.innerHTML = '<p class="ja-mail-date">' + m.date + '</p><p class="ja-mail-subject">' + cropBadge + badge + m.subject + '</p>';
      el.appendChild(row);
    });
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#C0392B;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function openJaMailBody(messageId) {
  document.getElementById('jaMailBodyTitle').textContent = '読み込み中...';
  document.getElementById('jaMailBodyDate').textContent = '';
  document.getElementById('jaMailBodyText').textContent = '';
  document.getElementById('jaMailBodyModal').style.display = 'flex';

  callServer({ action: 'getJaMailBody', userId: profile.userId, messageId: messageId }).then(function (result) {
    if (result.status !== 'ok') {
      document.getElementById('jaMailBodyTitle').textContent = 'エラー';
      document.getElementById('jaMailBodyText').textContent = result.message;
      return;
    }
    document.getElementById('jaMailBodyTitle').textContent = result.subject;
    document.getElementById('jaMailBodyDate').textContent = result.date;
    document.getElementById('jaMailBodyText').textContent = result.body;
  }).catch(function (err) {
    document.getElementById('jaMailBodyTitle').textContent = 'エラー';
    document.getElementById('jaMailBodyText').textContent = '通信エラーが発生しました：' + (err && err.message ? err.message : err);
  });
}

function closeJaMailBodyModal() {
  document.getElementById('jaMailBodyModal').style.display = 'none';
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    return callServer({ action: 'checkAdmin', userId: p.userId });
  }).then(function (result) {
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    if (result.status === 'ok') {
      document.getElementById('mainContent').style.display = 'block';
      loadJaMailList();
    } else {
      document.getElementById('blockedCard').style.display = 'block';
    }
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
</body>
</html>
