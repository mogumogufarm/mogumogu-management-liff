<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ機能</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px 40px; }
  .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .ai-status-link { font-size: 11px; color: #7A7256; background: none; border: 1px solid #D6CBAA; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #EAE0E8; color: #6A4A5E;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }

  .memo-form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .memo-form-row label { font-size: 12px; font-weight: 700; color: #6B6048; }
  .memo-textarea-wrap { position: relative; }
  .memo-form-row textarea {
    padding: 8px; padding-right: 40px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; width: 100%; resize: vertical;
  }
  .mic-btn {
    position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: #2E3B22; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .mic-btn.recording { background: #8B3A2E; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .visibility-toggle { display: flex; gap: 8px; }
  .visibility-btn { flex: 1; padding: 10px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 13px; cursor: pointer; }
  .visibility-btn.active { background: #2E3B22; border-color: #2E3B22; color: #fff; font-weight: 700; }
  .photo-preview { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
  .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .photo-input-btn { display: inline-block; padding: 8px 14px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-size: 12px; cursor: pointer; }

  .memo-item { border-bottom: 1px solid #D6CBAA; padding: 12px 0; }
  .memo-item:last-child { border-bottom: none; }
  .memo-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .memo-author { font-size: 11px; color: #7A7256; }
  .memo-tags { display: flex; gap: 4px; }
  .memo-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
  .memo-tag-personal { background: #EAE0E8; color: #6A4A5E; }
  .memo-tag-shared { background: #E3ECD3; color: #3E5A1F; }
  .memo-tag-category { background: #DCE6EA; color: #3D5A75; }
  .memo-title { font-size: 15px; font-weight: 700; color: #2E3B22; margin: 0 0 4px; }
  .memo-summary { font-size: 13px; color: #6B6048; margin: 0 0 6px; }
  .memo-photo { max-width: 100%; border-radius: 8px; margin-top: 6px; }
  .memo-actions { display: flex; gap: 8px; margin-top: 8px; }
  .memo-action-btn { padding: 5px 12px; border: 1px solid #D6CBAA; border-radius: 6px; background: #fff; color: #6B6048; font-family: inherit; font-size: 11px; cursor: pointer; }
  .memo-action-btn.danger { color: #8B3A2E; border-color: #E0BDB0; }

  .category-filter { margin-bottom: 12px; }
  .category-filter select { width: 100%; padding: 9px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; background: #fff; color: #2E3B22; }

  .memo-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #D6CBAA; cursor: pointer; }
  .memo-row:last-child { border-bottom: none; }
  .memo-row:active { opacity: 0.6; }
  .memo-row-icon { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .memo-row-thumb { flex-shrink: 0; width: 32px; height: 32px; border-radius: 7px; object-fit: cover; }
  .memo-row-main { flex: 1; min-width: 0; }
  .memo-row-title { font-size: 13px; font-weight: 700; color: #2E3B22; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .memo-row-date { font-size: 10px; color: #A69B7A; margin: 2px 0 0; }
  .memo-row-photo-icon { flex-shrink: 0; color: #7A7256; font-size: 14px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 2500; padding: 20px; }
  .modal-box { background: #F7F3E9; border-radius: 16px; padding: 20px; max-width: 480px; width: 100%; max-height: 82vh; overflow-y: auto; }
  .modal-close-btn { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 13px; cursor: pointer; }
  .memo-original-link { display: inline-block; font-size: 12px; font-weight: 700; color: #3D5A75; margin: 10px 0 4px; text-decoration: underline; }
  .memo-original-text { font-size: 13px; color: #2E3B22; margin: 0; white-space: pre-wrap; background: #fff; border: 1px solid #D6CBAA; border-radius: 8px; padding: 8px 10px; }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a>
    <button class="ai-status-link" onclick="checkAiStatus()">AI状態を確認</button>
  </div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-notes" aria-hidden="true"></i></span>メモ機能</h1>

  <div id="blockedCard" class="card" style="text-align:center; display:none;">
    <p style="font-weight:700; color:#8B3A2E;">この画面は管理者のみ利用できます</p>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="card">
      <input type="hidden" id="editingRowIndex" value="">
      <div class="memo-form-row">
        <label>メモの内容</label>
        <div class="memo-textarea-wrap">
          <textarea id="memoText" rows="3" placeholder="気づいたことを自由に書いてください（空欄で写真だけの投稿も可能です）"></textarea>
          <button type="button" class="mic-btn" id="micBtn" onclick="toggleVoiceInput()"><i class="ti ti-microphone" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="memo-form-row">
        <label>公開範囲</label>
        <div class="visibility-toggle">
          <button type="button" class="visibility-btn active" id="visPersonalBtn" onclick="setVisibility('個人')">個人</button>
          <button type="button" class="visibility-btn" id="visSharedBtn" onclick="setVisibility('共有')">共有</button>
        </div>
      </div>
      <div class="memo-form-row">
        <label>写真（任意）</label>
        <label class="photo-input-btn">
          写真を選ぶ
          <input type="file" id="memoPhotoInput" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoSelected()">
        </label>
        <img id="photoPreview" class="photo-preview">
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitMemo()">保存する</button>
    </div>

    <div class="card">
      <div class="category-filter"><select id="categoryFilter" onchange="onCategoryFilterChange()"></select></div>
      <div id="memoList">読み込み中...</div>
    </div>
  </div>

  <div id="memoDetailModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeMemoDetailModal();">
    <div class="modal-box">
      <div class="memo-meta" style="margin-bottom:8px;">
        <span class="memo-author" id="detailAuthor"></span>
        <span class="memo-tags" id="detailTags"></span>
      </div>
      <p class="memo-title" id="detailTitle"></p>
      <p class="memo-summary" id="detailSummary"></p>
      <a href="#" class="memo-original-link" id="detailOriginalLink" onclick="toggleOriginalText(event)">元のメモを表示</a>
      <p class="memo-original-text" id="detailOriginal" style="display:none;"></p>
      <img id="detailPhoto" class="memo-photo" style="display:none;">
      <div class="memo-actions" id="detailActions"></div>
      <button class="modal-close-btn" onclick="closeMemoDetailModal()">閉じる</button>
    </div>
  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">処理中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.04</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;
var currentVisibility = '個人';
var selectedPhotoBase64 = null;
var selectedPhotoMimeType = null;
var lastMemos = [];

function setVisibility(v) {
  currentVisibility = v;
  document.getElementById('visPersonalBtn').classList.toggle('active', v === '個人');
  document.getElementById('visSharedBtn').classList.toggle('active', v === '共有');
}

// ---- 音声入力 ----
var recognition = null;
var isRecording = false;
function toggleVoiceInput() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('お使いの環境では音声入力に対応していません（この機能はブラウザの仕組みに依存しており、LINEアプリ内では動かないことがよくあります）。「共有」ボタン等から「ブラウザで開く」を選び、Safari/Chromeで開いてお試しください。');
    return;
  }
  if (isRecording) {
    recognition.stop();
    return;
  }

  // マイクの使用許可を先に明示的に確認する（許可されていないと音声入力が無言のまま失敗するため）
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      startRecognition(SpeechRecognition);
    }).catch(function (err) {
      alert('マイクの使用が許可されていません。ブラウザの設定でマイクへのアクセスを許可してください。\n（' + err.name + '）');
    });
  } else {
    startRecognition(SpeechRecognition);
  }
}

function startRecognition(SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.onstart = function () {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
  };
  recognition.onend = function () {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.onerror = function (e) {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    alert('音声入力でエラーが発生しました：' + e.error);
  };
  recognition.onresult = function (e) {
    var transcript = e.results[0][0].transcript;
    var textarea = document.getElementById('memoText');
    textarea.value = (textarea.value ? textarea.value + ' ' : '') + transcript;
  };
  recognition.start();
}

// ---- AI状態確認 ----
function checkAiStatus() {
  showProcessing('AIの動作を確認しています...');
  callServer({ action: 'testMemoAiStatus', userId: profile.userId }).then(function (result) {
    hideProcessing();
    alert(result.message);
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

// ---- 写真選択 ----
function onPhotoSelected() {
  var fileInput = document.getElementById('memoPhotoInput');
  var file = fileInput.files[0];
  if (!file) return;
  selectedPhotoMimeType = file.type;

  var reader = new FileReader();
  reader.onload = function (e) {
    var dataUrl = e.target.result;
    selectedPhotoBase64 = dataUrl.split(',')[1];
    var preview = document.getElementById('photoPreview');
    preview.src = dataUrl;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ---- 保存・更新 ----
function submitMemo() {
  var text = document.getElementById('memoText').value.trim();
  var editingRowIndex = document.getElementById('editingRowIndex').value;
  var isEditing = !!editingRowIndex;

  if (!text && !selectedPhotoBase64 && !isEditing) {
    alert('メモの内容か、写真のどちらかを入力してください。');
    return;
  }
  if (isEditing && !text) {
    alert('メモの内容を入力してください。');
    return;
  }
  var ok = confirm((isEditing ? '更新' : (currentVisibility === '個人' ? '個人メモとして保存' : '共有メモとして保存')) + 'します。よろしいですか？');
  if (!ok) return;

  showProcessing('AIが要点を整理しています...');

  var action = isEditing ? 'updateMemo' : 'submitMemo';
  var payload = { action: action, userId: profile.userId, text: text, visibility: currentVisibility };
  if (isEditing) {
    payload.rowIndex = editingRowIndex;
  } else {
    payload.photoBase64 = selectedPhotoBase64;
    payload.photoMimeType = selectedPhotoMimeType;
  }

  callServer(payload).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') {
      resetForm();
      loadMemoList();
    }
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function resetForm() {
  document.getElementById('memoText').value = '';
  document.getElementById('memoPhotoInput').value = '';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('editingRowIndex').value = '';
  document.getElementById('submitBtn').textContent = '保存する';
  selectedPhotoBase64 = null;
  selectedPhotoMimeType = null;
  setVisibility('個人');
}

function startEditMemo(rowIndex) {
  var memo = lastMemos.filter(function (m) { return m.rowIndex === rowIndex; })[0];
  if (!memo) return;
  document.getElementById('memoText').value = memo.text;
  document.getElementById('editingRowIndex').value = rowIndex;
  document.getElementById('submitBtn').textContent = '更新する（写真は変更できません）';
  setVisibility(memo.visibility);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteMemoItem(rowIndex) {
  var ok = confirm('このメモを削除します。よろしいですか？（元に戻せません）');
  if (!ok) return;

  showProcessing('削除中...');
  callServer({ action: 'deleteMemo', userId: profile.userId, rowIndex: rowIndex }).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') loadMemoList();
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

// ---- 一覧読み込み ----
var MEMO_CATEGORY_COLORS = {
  'さくらんぼ': { bg: '#F0DAD0', fg: '#8B3A2E' },
  'もも': { bg: '#F0DEB8', fg: '#8A5A2A' },
  'スモモ': { bg: '#EAE0E8', fg: '#6A4A5E' },
  '葡萄': { bg: '#E3ECD3', fg: '#3E5A1F' },
  '柿': { bg: '#F0DEB8', fg: '#8A5A2A' },
  '防除': { bg: '#F0DAD0', fg: '#8B3A2E' },
  '収穫': { bg: '#DCEAE0', fg: '#2E5A4A' },
  '出荷': { bg: '#DCE6EA', fg: '#3D5A75' },
  'その他': { bg: '#E8E4DA', fg: '#6B6048' }
};
var currentCategoryFilter = 'すべて';

var categoryFilterInit = false;
function renderCategoryFilter() {
  if (categoryFilterInit) return;
  categoryFilterInit = true;
  var el = document.getElementById('categoryFilter');
  var categories = ['すべて', 'さくらんぼ', 'もも', 'スモモ', '葡萄', '柿', '防除', '収穫', '出荷', 'その他'];
  el.innerHTML = '';
  categories.forEach(function (c) {
    var opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    el.appendChild(opt);
  });
}

function onCategoryFilterChange() {
  currentCategoryFilter = document.getElementById('categoryFilter').value;
  renderMemoList();
}

function loadMemoList() {
  var el = document.getElementById('memoList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getMemoList', userId: profile.userId, limit: 50 }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#C0392B;">' + result.message + '</p>';
      return;
    }
    lastMemos = result.memos;
    renderCategoryFilter();
    renderMemoList();
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#C0392B;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function renderMemoList() {
  var el = document.getElementById('memoList');
  var memos = currentCategoryFilter === 'すべて' ? lastMemos : lastMemos.filter(function (m) { return m.category === currentCategoryFilter; });

  if (memos.length === 0) {
    el.innerHTML = '<p style="font-size:13px; color:#7A7256;">該当するメモがありません。</p>';
    return;
  }
  el.innerHTML = '';
  memos.forEach(function (m) {
    var colors = MEMO_CATEGORY_COLORS[m.category] || MEMO_CATEGORY_COLORS['その他'];
    var row = document.createElement('div');
    row.className = 'memo-row';
    row.onclick = function () { openMemoDetailModal(m.rowIndex); };
    var iconHtml = m.photoUrl
      ? '<img class="memo-row-thumb" src="' + m.photoUrl + '" loading="lazy">'
      : '<span class="memo-row-icon" style="background:' + colors.bg + ';color:' + colors.fg + ';"><i class="ti ti-file-text" aria-hidden="true"></i></span>';
    row.innerHTML =
      iconHtml +
      '<span class="memo-row-main"><p class="memo-row-title">' + m.title + '</p><p class="memo-row-date">' + m.date + '</p></span>';
    el.appendChild(row);
  });
}

function openMemoDetailModal(rowIndex) {
  var m = lastMemos.filter(function (x) { return x.rowIndex === rowIndex; })[0];
  if (!m) return;
  var visTagClass = m.visibility === '個人' ? 'memo-tag-personal' : 'memo-tag-shared';

  document.getElementById('detailOriginal').style.display = 'none';
  document.getElementById('detailOriginalLink').textContent = '元のメモを表示';
  document.getElementById('detailAuthor').textContent = m.date + '　' + m.authorName;
  document.getElementById('detailTags').innerHTML = '<span class="memo-tag memo-tag-category">' + m.category + '</span><span class="memo-tag ' + visTagClass + '">' + m.visibility + '</span>';
  document.getElementById('detailTitle').textContent = m.title;
  document.getElementById('detailSummary').textContent = m.summary;
  document.getElementById('detailOriginal').textContent = m.text;

  var photoEl = document.getElementById('detailPhoto');
  if (m.photoUrl) {
    photoEl.src = m.photoUrl;
    photoEl.style.display = 'block';
  } else {
    photoEl.style.display = 'none';
  }

  document.getElementById('detailActions').innerHTML = m.isOwn
    ? '<button class="memo-action-btn" onclick="startEditMemo(' + m.rowIndex + '); closeMemoDetailModal();">編集</button><button class="memo-action-btn danger" onclick="deleteMemoItem(' + m.rowIndex + '); closeMemoDetailModal();">削除</button>'
    : '';

  document.getElementById('memoDetailModal').style.display = 'flex';
}

function toggleOriginalText(e) {
  e.preventDefault();
  var textEl = document.getElementById('detailOriginal');
  var linkEl = document.getElementById('detailOriginalLink');
  var isHidden = textEl.style.display === 'none';
  textEl.style.display = isHidden ? 'block' : 'none';
  linkEl.textContent = isHidden ? '元のメモを閉じる' : '元のメモを表示';
}

function closeMemoDetailModal() {
  document.getElementById('memoDetailModal').style.display = 'none';
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    return callServer({ action: 'checkAdmin', userId: p.userId });
  }).then(function (result) {
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    if (result.status === 'ok') {
      document.getElementById('mainContent').style.display = 'block';
      loadMemoList();
    } else {
      document.getElementById('blockedCard').style.display = 'block';
    }
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
</body>
</html>
