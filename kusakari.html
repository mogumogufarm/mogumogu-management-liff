<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草刈り管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .top-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #E3ECD3; color: #3E5A1F;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .section-title {
    font-size: 15px; font-weight: 700; color: #2E3B22; margin: 26px 0 10px; padding-bottom: 6px;
    border-bottom: 2px solid #2E3B22; display: flex; align-items: center; gap: 6px;
  }
  .section-title:first-of-type { margin-top: 0; }

  .kusakari-alert { background: #F0DAD0; border: 1px solid #D9A88F; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .kusakari-alert-title { font-size: 13px; font-weight: 700; color: #8B3A2E; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .kusakari-alert-item { display: flex; justify-content: space-between; font-size: 12px; color: #6B3226; padding: 4px 0; border-top: 1px solid #E0BDB0; }
  .kusakari-alert-item:first-of-type { border-top: none; }

  .field-checklist { max-height: 260px; overflow-y: auto; border: 1px solid #D6CBAA; border-radius: 8px; margin-bottom: 10px; }
  .field-check-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #D6CBAA; font-size: 13px; }
  .field-check-item:last-child { border-bottom: none; }
  .field-check-item input { width: 17px; height: 17px; flex-shrink: 0; }
  .field-check-item label { flex: 1; }
  .check-all-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .check-all-btn { font-size: 11px; color: #3D5A75; background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .date-row label { font-size: 12px; font-weight: 700; color: #6B6048; white-space: nowrap; }
  .date-row input { flex: 1; padding: 9px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; }
  .record-submit-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

  .matrix-scroll { overflow-x: auto; border: 1px solid #D6CBAA; border-radius: 10px; }
  table.matrix-table { border-collapse: collapse; font-size: 12px; white-space: nowrap; width: 100%; }
  table.matrix-table th, table.matrix-table td { border-right: 1px solid #D6CBAA; padding: 8px 10px; text-align: center; }
  table.matrix-table th:last-child, table.matrix-table td:last-child { border-right: none; }
  table.matrix-table th { background: #2E3B22; color: #F7F3E9; font-weight: 700; }
  table.matrix-table td.field-col, table.matrix-table th.field-col {
    position: sticky; left: 0; text-align: left; font-weight: 700; color: #2E3B22; background: #F7F3E9;
    border-right: 2px solid #8A5A2A;
  }
  table.matrix-table th.field-col { background: #2E3B22; color: #F7F3E9; border-right: 2px solid #D6CBAA; }
  table.matrix-table tr:nth-child(even) td.field-col { background: #EFE8D8; }
  .print-btn { width: 100%; padding: 9px; margin: 10px 0 0; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 12px; cursor: pointer; }

  .print-doc-header { display: none; }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }

  @media print {
    @page { size: landscape; margin: 15mm; }
    body { background: #fff; color: #000; }
    .top-nav, .site-title, .print-btn, .kusakari-alert,
    .card > .check-all-row, .card > .field-checklist, .card > .date-row, .card > .record-submit-btn,
    .processing-overlay, .status, p[style*="text-align:center"] { display: none !important; }
    .card { border: none; padding: 0; background: #fff; box-shadow: none; }
    .section-title { display: none; }
    .print-doc-header { display: block !important; margin-bottom: 14px; }
    .print-doc-header h2 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
    .print-doc-header p { font-size: 11px; color: #333; margin: 0; }
    table.matrix-table { border: 1.5px solid #000; }
    table.matrix-table th, table.matrix-table td { border: 1px solid #000 !important; color: #000 !important; }
    table.matrix-table th { background: #E8E8E8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.matrix-table td.field-col, table.matrix-table th.field-col { position: static; background: #fff !important; }
    .matrix-scroll { border: none; overflow: visible; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <div id="navHamburgerSlot"></div>
    <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a>
  </div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-cut" aria-hidden="true"></i></span>草刈り・刈払い管理</h1>

  <div id="blockedCard" class="card" style="text-align:center; display:none;">
    <p style="font-weight:700; color:#8B3A2E;">この画面は管理者のみ利用できます</p>
  </div>

  <div id="mainContent" style="display:none;">

    <p class="section-title"><i class="ti ti-tractor" aria-hidden="true"></i> 草刈り（乗用モアー）</p>
    <div id="alertBox_草刈り"></div>
    <div class="card">
      <div class="check-all-row">
        <span style="font-size:12px; font-weight:700; color:#6B6048;">対象の圃場を選ぶ</span>
        <button class="check-all-btn" onclick="toggleCheckAll('草刈り')">全選択／解除</button>
      </div>
      <div class="field-checklist" id="checklist_草刈り"></div>
      <div class="date-row">
        <label>実施日</label>
        <input type="date" id="date_草刈り">
      </div>
      <button class="record-submit-btn" onclick="submitBulk('草刈り')">まとめて記録する</button>
    </div>
    <div class="card">
      <div class="matrix-scroll"><div id="matrix_草刈り">読み込み中...</div></div>
      <button class="print-btn" onclick="printMatrix('草刈り')"><i class="ti ti-printer" aria-hidden="true"></i> PDFで出力（横向き・書類形式）</button>
    </div>

    <p class="section-title"><i class="ti ti-scissors" aria-hidden="true"></i> 刈払い（際・法面）</p>
    <div id="alertBox_刈払い"></div>
    <div class="card">
      <div class="check-all-row">
        <span style="font-size:12px; font-weight:700; color:#6B6048;">対象の圃場を選ぶ</span>
        <button class="check-all-btn" onclick="toggleCheckAll('刈払い')">全選択／解除</button>
      </div>
      <div class="field-checklist" id="checklist_刈払い"></div>
      <div class="date-row">
        <label>実施日</label>
        <input type="date" id="date_刈払い">
      </div>
      <button class="record-submit-btn" onclick="submitBulk('刈払い')">まとめて記録する</button>
    </div>
    <div class="card">
      <div class="matrix-scroll"><div id="matrix_刈払い">読み込み中...</div></div>
      <button class="print-btn" onclick="printMatrix('刈払い')"><i class="ti ti-printer" aria-hidden="true"></i> PDFで出力（横向き・書類形式）</button>
    </div>

  </div>

  <div class="print-doc-header" id="printDocHeader">
    <h2>もぐもぐ農園　<span id="printDocTitle"></span>記録簿</h2>
    <p id="printDocDate"></p>
  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">読み込み中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.04</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;
initNavDrawer('kusakari.html');

var KUSAKARI_TYPES = ['草刈り', '刈払い'];
var MIN_COLUMNS = { '草刈り': 7, '刈払い': 3 };
var fieldNamesList = [];

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function loadFieldOptions() {
  return callServer({ action: 'getFieldList', userId: profile.userId }).then(function (result) {
    if (result.status !== 'ok') return;
    fieldNamesList = result.fields.map(function (f) { return f.name; });
    KUSAKARI_TYPES.forEach(function (type) {
      var el = document.getElementById('checklist_' + type);
      var html = '';
      fieldNamesList.forEach(function (name, idx) {
        var id = 'chk_' + type + '_' + idx;
        html += '<div class="field-check-item"><input type="checkbox" id="' + id + '" value="' + name.replace(/"/g, '&quot;') + '"><label for="' + id + '">' + name + '</label></div>';
      });
      el.innerHTML = html;
    });
  });
}

function toggleCheckAll(type) {
  var boxes = document.querySelectorAll('#checklist_' + type + ' input[type="checkbox"]');
  var allChecked = Array.prototype.every.call(boxes, function (b) { return b.checked; });
  boxes.forEach(function (b) { b.checked = !allChecked; });
}

function submitBulk(type) {
  var boxes = document.querySelectorAll('#checklist_' + type + ' input[type="checkbox"]:checked');
  var fields = Array.prototype.map.call(boxes, function (b) { return b.value; });
  var date = document.getElementById('date_' + type).value;

  if (fields.length === 0) {
    alert('圃場を1つ以上選んでください。');
    return;
  }
  if (!date) {
    alert('日付を選んでください。');
    return;
  }

  var ok = confirm(fields.length + '件の圃場について、' + date + 'に' + type + 'を実施したとして記録します。よろしいですか？');
  if (!ok) return;

  showProcessing('記録中...');
  callServer({ action: 'submitKusakariRecordsBulk', userId: profile.userId, fields: fields, type: type, date: date }).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') {
      document.querySelectorAll('#checklist_' + type + ' input[type="checkbox"]').forEach(function (b) { b.checked = false; });
      document.getElementById('date_' + type).value = todayStr();
      loadTypeData(type);
    }
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function loadAll() {
  KUSAKARI_TYPES.forEach(loadTypeData);
}

function loadTypeData(type) {
  loadAlert(type);
  loadMatrix(type);
}

function loadAlert(type) {
  var el = document.getElementById('alertBox_' + type);
  callServer({ action: 'getKusakariStatus', userId: profile.userId, type: type }).then(function (result) {
    if (result.status !== 'ok') { el.innerHTML = ''; return; }
    var overdue = result.rows.filter(function (r) { return r.elapsedDays !== null && r.elapsedDays >= 30; });
    if (overdue.length === 0) { el.innerHTML = ''; return; }
    var html = '<div class="kusakari-alert"><p class="kusakari-alert-title"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ' + overdue.length + '件、30日以上経過しています</p>';
    overdue.forEach(function (r) {
      html += '<div class="kusakari-alert-item"><span>' + r.field + '</span><span>' + r.elapsedDays + '日経過</span></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  });
}

function loadMatrix(type) {
  var el = document.getElementById('matrix_' + type);
  el.innerHTML = '<p style="font-size:13px; color:#7A7256; padding:10px;">読み込み中...</p>';

  callServer({ action: 'getKusakariMatrix', userId: profile.userId, type: type }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#C0392B; padding:10px;">' + result.message + '</p>';
      return;
    }
    if (result.fields.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256; padding:10px;">圃場マスタに圃場が登録されていません。</p>';
      return;
    }
    var colCount = Math.max(result.maxCount, MIN_COLUMNS[type] || 3);
    var html = '<table class="matrix-table" id="matrixTable_' + type + '"><tr><th class="field-col">圃場名</th>';
    for (var c = 1; c <= colCount; c++) html += '<th>' + c + '回目</th>';
    html += '</tr>';
    result.fields.forEach(function (field) {
      var dates = result.matrix[field] || [];
      html += '<tr><td class="field-col">' + field + '</td>';
      for (var c = 0; c < colCount; c++) {
        html += '<td>' + (dates[c] ? dates[c].slice(5).replace('-', '/') : '') + '</td>';
      }
      html += '</tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#C0392B; padding:10px;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function printMatrix(type) {
  document.title = type + '記録簿';
  document.getElementById('printDocTitle').textContent = type;
  document.getElementById('printDocDate').textContent = '作成日：' + todayStr();

  KUSAKARI_TYPES.forEach(function (t) {
    var table = document.getElementById('matrixTable_' + t);
    if (!table) return;
    var wrapCard = table.closest('.card');
    if (wrapCard) wrapCard.style.display = (t === type) ? '' : 'none';
  });

  window.print();

  setTimeout(function () {
    KUSAKARI_TYPES.forEach(function (t) {
      var table = document.getElementById('matrixTable_' + t);
      if (!table) return;
      var wrapCard = table.closest('.card');
      if (wrapCard) wrapCard.style.display = '';
    });
  }, 500);
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    return callServer({ action: 'checkAdmin', userId: p.userId });
  }).then(function (result) {
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    if (result.status === 'ok') {
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('date_草刈り').value = todayStr();
      document.getElementById('date_刈払い').value = todayStr();
      loadFieldOptions().then(loadAll);
    } else {
      document.getElementById('blockedCard').style.display = 'block';
    }
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
</body>
</html>
