<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料アップロード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  .top-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #E3ECD3; color: #3E5A1F;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 700; color: #2E3B22; margin: 0 0 12px; }

  label.field-label { font-size: 12px; font-weight: 700; color: #6B6048; display: block; margin-bottom: 6px; }
  input[type="text"], textarea {
    width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #D6CBAA;
    font-family: inherit; margin-bottom: 14px; resize: vertical;
  }
  textarea { min-height: 80px; }
  input[type="file"] { width: 100%; margin-bottom: 14px; font-size: 13px; }
  .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

  .doc-item { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .doc-title { font-size: 14px; font-weight: 700; color: #2E3B22; margin: 0 0 4px; }
  .doc-meta { font-size: 11px; color: #A69B7A; margin: 0 0 8px; }
  .doc-body { font-size: 13px; color: #4A4738; white-space: pre-line; margin: 0 0 10px; }
  .doc-file-name { font-size: 12px; color: #6B6048; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .doc-actions { display: flex; gap: 8px; }
  .doc-download-btn {
    flex: 1; text-align: center; padding: 9px; border-radius: 8px; background: #2E3B22; color: #fff;
    font-size: 12px; font-weight: 700; text-decoration: none;
  }
  .doc-delete-btn {
    padding: 9px 14px; border: 1px solid #E0BDB0; border-radius: 8px; background: #fff; color: #8B3A2E;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <div id="navHamburgerSlot"></div>
    <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a>
  </div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-file-upload" aria-hidden="true"></i></span>資料アップロード</h1>

  <div id="mainContent" style="display:none;">

    <div class="card">
      <p class="card-title">新しい資料を登録する</p>
      <label class="field-label">タイトル</label>
      <input type="text" id="docTitle" placeholder="例：〇〇資材の見積もり">
      <label class="field-label">本文</label>
      <textarea id="docBody" placeholder="内容やメモを入力"></textarea>
      <label class="field-label">添付ファイル（写真・PDF・Excelなど、どの形式でもOK）</label>
      <input type="file" id="docFile">
      <button class="submit-btn" onclick="submitDocument()">登録する</button>
    </div>

    <p class="card-title" style="margin: 20px 4px 10px;">登録済みの資料</p>
    <div id="documentList">読み込み中...</div>

  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">読み込み中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.00</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;
initNavDrawer('documents.html');

function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function submitDocument() {
  var title = document.getElementById('docTitle').value.trim();
  var body = document.getElementById('docBody').value.trim();
  var fileInput = document.getElementById('docFile');
  var file = fileInput.files[0];

  if (!title) {
    alert('タイトルを入力してください。');
    return;
  }

  showProcessing('登録中...');

  var proceed = file ? fileToBase64(file) : Promise.resolve(null);
  proceed.then(function (base64) {
    return callServer({
      action: 'submitDocument', userId: profile.userId, title: title, body: body,
      fileBase64: base64, fileName: file ? file.name : '', mimeType: file ? file.type : ''
    });
  }).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') {
      document.getElementById('docTitle').value = '';
      document.getElementById('docBody').value = '';
      fileInput.value = '';
      loadDocumentList();
    }
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function loadDocumentList() {
  var el = document.getElementById('documentList');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';

  callServer({ action: 'getDocumentList', userId: profile.userId, limit: 50 }).then(function (result) {
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#C0392B;">' + result.message + '</p>';
      return;
    }
    if (result.rows.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">まだ資料がありません。</p>';
      return;
    }
    var html = '';
    result.rows.forEach(function (r) {
      html += '<div class="doc-item">' +
        '<p class="doc-title">' + r.title + '</p>' +
        '<p class="doc-meta">' + r.date + '　' + r.recordedBy + '</p>' +
        (r.body ? '<p class="doc-body">' + r.body + '</p>' : '') +
        (r.fileName ? '<p class="doc-file-name"><i class="ti ti-paperclip" aria-hidden="true"></i>' + r.fileName + '</p>' : '') +
        '<div class="doc-actions">' +
        (r.downloadUrl ? '<a class="doc-download-btn" href="' + r.downloadUrl + '" target="_blank"><i class="ti ti-download" aria-hidden="true"></i> ダウンロード</a>' : '') +
        '<button class="doc-delete-btn" onclick="deleteDocumentRow(' + r.rowIndex + ')">削除</button>' +
        '</div></div>';
    });
    el.innerHTML = html;
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#C0392B;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

function deleteDocumentRow(rowIndex) {
  var ok = confirm('この資料を削除します。よろしいですか？');
  if (!ok) return;
  showProcessing('削除中...');
  callServer({ action: 'deleteDocument', userId: profile.userId, rowIndex: rowIndex }).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') loadDocumentList();
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    loadDocumentList();
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
</body>
</html>
