<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JA共選 取り込み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #EFE8D8;
    color: #2E3B22;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px 40px; }
  .top-nav { text-align: left; margin-bottom: 10px; }
  .top-nav a { font-size: 12px; color: #7A7256; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .site-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .site-title .icon-badge {
    width: 32px; height: 32px; border-radius: 9px; background: #F0DEB8; color: #8A5A2A;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card { background: #F7F3E9; border: 1px solid #D6CBAA; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }

  .photo-input-btn { display: block; text-align: center; padding: 14px; border: 2px dashed #D6CBAA; border-radius: 10px; background: #fff; color: #6B6048; font-size: 13px; cursor: pointer; }
  .photo-preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }

  .doc-type-label { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: #E3ECD3; color: #3E5A1F; margin-bottom: 10px; }
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-btn { flex: 1; padding: 10px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 12px; cursor: pointer; }
  .mode-btn.active { background: #2E3B22; border-color: #2E3B22; color: #fff; font-weight: 700; }
  .doc-type-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
  .doc-type-btn { flex: 1; min-width: 100px; padding: 8px 4px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 11px; cursor: pointer; }
  .doc-type-btn.active { background: #8A5A2A; border-color: #8A5A2A; color: #fff; font-weight: 700; }
  .manual-field-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .manual-field-row label { font-size: 12px; font-weight: 700; color: #6B6048; }
  .manual-field-row input { padding: 8px; font-size: 13px; border-radius: 8px; border: 1px solid #D6CBAA; font-family: inherit; width: 100%; }
  .manual-entry-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .manual-entry-row input { flex: 1; min-width: 0; padding: 6px; font-size: 12px; border-radius: 6px; border: 1px solid #D6CBAA; font-family: inherit; }
  .manual-remove-btn { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 1px solid #E0BDB0; background: #fff; color: #8B3A2E; font-size: 12px; cursor: pointer; }
  .add-row-btn { width: 100%; padding: 8px; border: 1px dashed #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
  .manual-entries-label { font-size: 11px; font-weight: 700; color: #7A7256; margin: 6px 0 4px; }
  table.grid-input-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.grid-input-table th, table.grid-input-table td { border: 1px solid #D6CBAA; padding: 4px; text-align: center; font-size: 11px; }
  table.grid-input-table th { background: #EFE8D8; font-weight: 700; color: #6B6048; }
  table.grid-input-table td input { width: 100%; border: none; text-align: center; font-size: 12px; padding: 4px 2px; background: transparent; }
  table.grid-input-table td input:focus { background: #FFF8E8; outline: 1px solid #8A5A2A; }
  table.preview-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  table.preview-table th, table.preview-table td { border: 1px solid #D6CBAA; padding: 5px 6px; text-align: center; }
  table.preview-table th { background: #EFE8D8; font-weight: 700; }
  .preview-meta { font-size: 12px; color: #6B6048; margin: 0 0 10px; line-height: 1.7; }
  .no-price-note { color: #8B3A2E; }

  .confirm-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2E3B22; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .cancel-btn { width: 100%; padding: 10px; border: 1px solid #D6CBAA; border-radius: 8px; background: #fff; color: #6B6048; font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 8px; }

  .status {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; z-index: 2000;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
    line-height: 1.6; display: none; white-space: pre-line; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .status.show { display: block; }
  .status.error { background: #8B3A2E; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav" style="display:flex; align-items:center; gap:10px;">
    <div id="navHamburgerSlot"></div>
    <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホームへ戻る</a>
  </div>
  <h1 class="site-title"><span class="icon-badge"><i class="ti ti-file-invoice" aria-hidden="true"></i></span>JA共選 取り込み</h1>

  <div id="blockedCard" class="card" style="text-align:center; display:none;">
    <p style="font-weight:700; color:#8B3A2E;">この画面は管理者のみ利用できます</p>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="card" style="text-align:center;">
      <p style="font-size:12px; color:#6B6048; margin:0 0 8px;">JA共選・丸統商事の売上を、見やすい一覧表にまとめます。</p>
      <button class="confirm-btn" onclick="generateSummaryTable()">スプレッドシートにまとめ表を作成する</button>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="modeAiBtn" onclick="switchInputMode('ai')">写真から読み取る</button>
      <button class="mode-btn" id="modeManualBtn" onclick="switchInputMode('manual')">手入力する</button>
      <button class="mode-btn" id="modeCheckBtn" onclick="switchInputMode('check')">登録済みを確認</button>
    </div>

    <div id="checkModeSection" style="display:none;">
      <div class="card">
        <div class="doc-type-toggle">
          <button class="doc-type-btn active" id="checkSourceBtn荷受記録" onclick="setCheckSource('荷受記録')">JA荷受記録</button>
          <button class="doc-type-btn" id="checkSourceBtn丸統記録" onclick="setCheckSource('丸統記録')">丸統記録</button>
          <button class="doc-type-btn" id="checkSourceBtn価格履歴" onclick="setCheckSource('価格履歴')">JA価格履歴</button>
        </div>
      </div>
      <div class="card">
        <div id="checkListContent">読み込み中...</div>
      </div>
    </div>

    <div id="aiModeSection">
    <div class="card">
      <p style="font-size:12px; color:#6B6048; margin:0 0 10px;">市況速報・荷受票・精算通知書のいずれかの写真をアップロードしてください。種類はAIが自動で判定します。</p>
      <label class="photo-input-btn">
        <i class="ti ti-camera" aria-hidden="true"></i>　写真を選ぶ
        <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="onPhotoSelected()">
      </label>
      <img id="photoPreview" class="photo-preview">
    </div>

    <div id="previewCard" class="card" style="display:none;">
      <div id="previewContent"></div>
      <button class="confirm-btn" id="confirmBtn" onclick="confirmSubmit()">この内容で登録する</button>
      <button class="cancel-btn" onclick="cancelPreview()">やり直す</button>
    </div>
    </div>

    <div id="manualModeSection" style="display:none;">
      <div class="card">
        <div class="doc-type-toggle">
          <button class="doc-type-btn active" id="docTypeBtn市況速報" onclick="setManualDocType('市況速報')">市況速報</button>
          <button class="doc-type-btn" id="docTypeBtn荷受票" onclick="setManualDocType('荷受票')">荷受票</button>
          <button class="doc-type-btn" id="docTypeBtn精算通知書" onclick="setManualDocType('精算通知書')">精算通知書</button>
          <button class="doc-type-btn" id="docTypeBtn売立案内書" onclick="setManualDocType('売立案内書')">売立案内書</button>
        </div>
      </div>

      <div id="manualFormCard" class="card"></div>
    </div>
  </div>

  <div class="processing-overlay" id="processingOverlay" style="display:none;">
    <div class="processing-box">
      <div class="spinner"></div>
      <p id="processingText">処理中...</p>
    </div>
  </div>

  <div class="status" id="initStatus" style="display:none;"></div>

  <p style="text-align:center; font-size:10px; color:#A69B7A; margin-top:20px;">v1.08</p>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznmvwCK8JdC-BsXRjcaTNj6lhm_11EyPW4xv_fSaXmxt6FsZzFFPG2FLk7wsLuSROItA/exec';
var LIFF_ID = '2010745560-GD4XbdoK';

var profile = null;
var currentIdToken = null;
initNavDrawer('ja-kyousen.html');
var selectedPhotoBase64 = null;
var selectedPhotoMimeType = null;
var currentAnalysis = null;

// ---- 入力モード切り替え ----
function generateSummaryTable() {
  showProcessing('まとめ表を作成中...');
  callServer({ action: 'generateJaSummaryTable', userId: profile.userId }).then(function (result) {
    hideProcessing();
    alert(result.message);
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function switchInputMode(mode) {
  document.getElementById('modeAiBtn').classList.toggle('active', mode === 'ai');
  document.getElementById('modeManualBtn').classList.toggle('active', mode === 'manual');
  document.getElementById('modeCheckBtn').classList.toggle('active', mode === 'check');
  document.getElementById('aiModeSection').style.display = (mode === 'ai') ? 'block' : 'none';
  document.getElementById('manualModeSection').style.display = (mode === 'manual') ? 'block' : 'none';
  document.getElementById('checkModeSection').style.display = (mode === 'check') ? 'block' : 'none';
  if (mode === 'manual' && !document.getElementById('manualFormCard').innerHTML) setManualDocType('市況速報');
  if (mode === 'check' && !document.getElementById('checkListContent').getAttribute('data-loaded')) setCheckSource('荷受記録');
}

var currentCheckSource = '荷受記録';
function setCheckSource(source) {
  currentCheckSource = source;
  ['荷受記録', '丸統記録', '価格履歴'].forEach(function (s) {
    document.getElementById('checkSourceBtn' + s).classList.toggle('active', s === source);
  });
  loadCheckList();
}

function loadCheckList() {
  var el = document.getElementById('checkListContent');
  el.innerHTML = '<p style="font-size:13px; color:#7A7256;">読み込み中...</p>';
  callServer({ action: 'getJaRecordsList', userId: profile.userId, source: currentCheckSource, limit: 50 }).then(function (result) {
    el.setAttribute('data-loaded', '1');
    if (result.status !== 'ok') {
      el.innerHTML = '<p style="font-size:13px; color:#C0392B;">' + result.message + '</p>';
      return;
    }
    if (result.rows.length === 0) {
      el.innerHTML = '<p style="font-size:13px; color:#7A7256;">まだデータがありません。</p>';
      return;
    }
    var html = '<table class="preview-table">';
    if (currentCheckSource === '荷受記録') {
      html += '<tr><th>選果年月日</th><th>品種</th><th>等級</th><th>階級</th><th>箱数</th><th>単価</th><th>金額</th><th>状態</th></tr>';
      result.rows.forEach(function (r) {
        html += '<tr><td>' + r.date + '</td><td>' + r.variety + '</td><td>' + r.grade + '</td><td>' + r.size + '</td><td>' + r.boxes + '</td><td>' + (r.unitPrice ? r.unitPrice.toLocaleString() + '円' : '-') + '</td><td>' + (r.amount ? '¥' + Number(r.amount).toLocaleString() : '-') + '</td><td>' + (r.status || '仮') + '</td></tr>';
      });
    } else if (currentCheckSource === '丸統記録') {
      html += '<tr><th>売立日</th><th>品名</th><th>等級</th><th>階級</th><th>箱数</th><th>単価</th><th>金額</th></tr>';
      result.rows.forEach(function (r) {
        html += '<tr><td>' + r.date + '</td><td>' + r.itemName + '</td><td>' + r.grade + '</td><td>' + r.size + '</td><td>' + r.boxes + '</td><td>' + r.unitPrice.toLocaleString() + '円</td><td>¥' + Number(r.amount).toLocaleString() + '</td></tr>';
      });
    } else if (currentCheckSource === '価格履歴') {
      html += '<tr><th>速報日付</th><th>品種</th><th>等級</th><th>階級</th><th>単価</th></tr>';
      result.rows.forEach(function (r) {
        html += '<tr><td>' + r.reportDate + '</td><td>' + r.variety + '</td><td>' + r.grade + '</td><td>' + r.size + '</td><td>' + r.price.toLocaleString() + '円</td></tr>';
      });
    }
    html += '</table>';
    el.innerHTML = html;
  }).catch(function (err) {
    el.innerHTML = '<p style="font-size:13px; color:#C0392B;">通信エラーが発生しました：' + (err && err.message ? err.message : err) + '</p>';
  });
}

var currentManualDocType = '市況速報';
var JA_FIXED_MEMBER_CODE = '211050';       // JA共選：組合員コード（固定）
var JA_FIXED_PRODUCER_NAME = '金子昌円';    // JA共選：生産者名（固定）

var MANUAL_FORM_CONFIGS = {
  '市況速報': {
    headerFields: [{ key: 'reportDate', label: '速報日付', type: 'date' }, { key: 'variety', label: '品種', kind: 'variety' }],
    gridMode: true,
    gridValueLabel: '単価',
    submitAction: 'submitJaMarketPrices'
  },
  '荷受票': {
    headerFields: [
      { key: 'date', label: '選果年月日', type: 'date' },
      { key: 'variety', label: '品種', kind: 'variety' }, { key: 'unitWeight', label: '量目(kg/箱)', numeric: true }
    ],
    gridMode: true,
    gridValueLabel: '箱数',
    submitAction: 'submitJaUkeoi'
  },
  '精算通知書': {
    headerFields: [{ key: 'variety', label: '品種', kind: 'variety' }],
    rowFields: [
      { key: 'date', label: '選果年月日', type: 'date' }, { key: 'size', label: '階級', kind: 'size' },
      { key: 'weight', label: '出荷量kg', numeric: true }, { key: 'unitPrice', label: '単価', numeric: true }, { key: 'amount', label: '精算金額', numeric: true }
    ],
    submitAction: 'submitJaSettlement'
  },
  '売立案内書': {
    headerFields: [{ key: 'sellDate', label: '売立日', type: 'date' }, { key: 'finalAmount', label: '差引仕切金額', numeric: true }],
    rowFields: [
      { key: 'itemName', label: '品名' }, { key: 'grade', label: '等級', kind: 'grade' }, { key: 'size', label: '階級', kind: 'size' },
      { key: 'boxes', label: '箱数', numeric: true }, { key: 'unitPrice', label: '単価', numeric: true }, { key: 'amount', label: '金額', numeric: true }
    ],
    submitAction: 'submitMarutou'
  }
};

function setManualDocType(docType) {
  currentManualDocType = docType;
  ['市況速報', '荷受票', '精算通知書', '売立案内書'].forEach(function (t) {
    document.getElementById('docTypeBtn' + t).classList.toggle('active', t === docType);
  });
  renderManualForm();
}

var JA_GRADE_OPTIONS_MOMO = ['EX', '特青', '特赤', '青秀', '赤秀'];
var JA_GRADE_OPTIONS_OTHER = ['秀', '赤秀', '丸秀'];
var JA_SIZE_OPTIONS = ['4L', '3L', '2L', 'L', 'M', 'S'];
var varietyListData = null; // { crops: [...], byCrop: {...} }

function loadVarietyListForJa() {
  return callServer({ action: 'getVarietyList', userId: profile.userId }).then(function (result) {
    if (result.status === 'ok') varietyListData = result;
  });
}

function isVarietyMomo(variety) {
  if (!varietyListData) return false;
  return (varietyListData.byCrop['もも'] || []).indexOf(variety) !== -1;
}

function gradeOptionsForVariety(variety) {
  return isVarietyMomo(variety) ? JA_GRADE_OPTIONS_MOMO : JA_GRADE_OPTIONS_OTHER;
}

function buildVarietySelectHtml(idAttr, extraAttrs) {
  var html = '<select id="' + idAttr + '" ' + (extraAttrs || '') + '><option value="">選択</option>';
  if (varietyListData) {
    varietyListData.crops.forEach(function (crop) {
      html += '<optgroup label="' + crop + '">';
      varietyListData.byCrop[crop].forEach(function (v) {
        html += '<option value="' + v + '">' + v + '</option>';
      });
      html += '</optgroup>';
    });
  }
  html += '</select>';
  return html;
}

function buildGradeSelectHtml(attrs, initialVariety) {
  var options = gradeOptionsForVariety(initialVariety || '');
  var html = '<select ' + attrs + '><option value="">選択</option>';
  options.forEach(function (g) { html += '<option value="' + g + '">' + g + '</option>'; });
  html += '</select>';
  return html;
}

function buildSizeSelectHtml(attrs) {
  var html = '<select ' + attrs + '><option value="">選択</option>';
  JA_SIZE_OPTIONS.forEach(function (s) { html += '<option value="' + s + '">' + s + '</option>'; });
  html += '</select>';
  return html;
}

function renderManualForm() {
  var config = MANUAL_FORM_CONFIGS[currentManualDocType];
  var el = document.getElementById('manualFormCard');
  var html = '';

  config.headerFields.forEach(function (f) {
    var inputHtml;
    if (f.kind === 'variety') {
      inputHtml = buildVarietySelectHtml('manualHeader_' + f.key, 'onchange="onHeaderVarietyChange()"');
    } else {
      inputHtml = '<input type="' + (f.type || 'text') + '" id="manualHeader_' + f.key + '">';
    }
    html += '<div class="manual-field-row"><label>' + f.label + '</label>' + inputHtml + '</div>';
  });

  if (config.gridMode) {
    html += '<p class="manual-entries-label">数量を入力してください（空欄のマスは無視されます）</p>';
    html += '<div id="gridTableWrap"></div>';
    html += '<button class="confirm-btn" onclick="submitManualForm()">この内容で登録する</button>';
    el.innerHTML = html;
    renderGridTable();
  } else {
    html += '<p class="manual-entries-label">明細行</p>';
    html += '<div id="manualRows"></div>';
    html += '<button type="button" class="add-row-btn" onclick="addManualRow()">＋ 行を追加</button>';
    html += '<button class="confirm-btn" onclick="submitManualForm()">この内容で登録する</button>';
    el.innerHTML = html;
    addManualRow();
  }
}

// 荷受票・市況速報：秀・赤秀・丸秀（またはももの5等級）×4L〜Sの固定マス目を表示し、数量だけ入力する
function renderGridTable() {
  var headerVarietyEl = document.getElementById('manualHeader_variety');
  var variety = headerVarietyEl ? headerVarietyEl.value : '';
  var grades = gradeOptionsForVariety(variety);

  var html = '<table class="grid-input-table"><tr><th></th>';
  grades.forEach(function (g) { html += '<th>' + g + '</th>'; });
  html += '</tr>';
  JA_SIZE_OPTIONS.forEach(function (size) {
    html += '<tr><th>' + size + '</th>';
    grades.forEach(function (g) {
      html += '<td><input type="number" data-size="' + size + '" data-grade="' + g + '"></td>';
    });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('gridTableWrap').innerHTML = html;
}


// 品種が変わったら、グリッドモードならマス目の等級列を、行モードなら各行の等級選択肢を更新する
function onHeaderVarietyChange() {
  var config = MANUAL_FORM_CONFIGS[currentManualDocType];
  if (config.gridMode) {
    renderGridTable();
    return;
  }
  if (!config.gradeFromHeader) return;
  var headerVariety = document.getElementById('manualHeader_variety').value;
  document.querySelectorAll('#manualRows select[data-key="grade"]').forEach(function (sel) {
    var current = sel.value;
    sel.innerHTML = '';
    var options = gradeOptionsForVariety(headerVariety);
    var optHtml = '<option value="">選択</option>';
    options.forEach(function (g) { optHtml += '<option value="' + g + '"' + (g === current ? ' selected' : '') + '>' + g + '</option>'; });
    sel.innerHTML = optHtml;
  });
}

function addManualRow() {
  var config = MANUAL_FORM_CONFIGS[currentManualDocType];
  var rowsEl = document.getElementById('manualRows');
  var rowId = 'row_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  var row = document.createElement('div');
  row.className = 'manual-entry-row';
  row.id = rowId;

  var headerVarietyEl = document.getElementById('manualHeader_variety');
  var headerVariety = headerVarietyEl ? headerVarietyEl.value : '';

  var inputsHtml = config.rowFields.map(function (f) {
    if (f.kind === 'variety') {
      return buildVarietySelectHtml('', 'data-key="' + f.key + '" onchange="onRowVarietyChange(this)"');
    }
    if (f.kind === 'grade') {
      return buildGradeSelectHtml('data-key="' + f.key + '"' + (config.gradeFromHeader ? '' : ''), headerVariety);
    }
    if (f.kind === 'size') {
      return buildSizeSelectHtml('data-key="' + f.key + '"');
    }
    return '<input type="' + (f.type || (f.numeric ? 'number' : 'text')) + '" placeholder="' + f.label + '" data-key="' + f.key + '">';
  }).join('');

  row.innerHTML = inputsHtml + '<button type="button" class="manual-remove-btn" onclick="document.getElementById(\'' + rowId + '\').remove()"><i class="ti ti-x" aria-hidden="true"></i></button>';
  rowsEl.appendChild(row);
}

// 同じ行の中に品種の選択肢がある場合（市況速報・売立案内書）、変わったらその行の等級の選択肢を更新する
function onRowVarietyChange(selectEl) {
  var rowEl = selectEl.closest('.manual-entry-row');
  var gradeSel = rowEl.querySelector('select[data-key="grade"]');
  if (!gradeSel) return;
  var current = gradeSel.value;
  var options = gradeOptionsForVariety(selectEl.value);
  var optHtml = '<option value="">選択</option>';
  options.forEach(function (g) { optHtml += '<option value="' + g + '"' + (g === current ? ' selected' : '') + '>' + g + '</option>'; });
  gradeSel.innerHTML = optHtml;
}

function loadFromInputSheet() {
  var ok = confirm('スプレッドシートの「' + JA_INPUT_SHEET_NAMES[currentManualDocType] + '」シートに入力済みの内容を読み込みます。よろしいですか？');
  if (!ok) return;
  showProcessing('読み込み中...');
  callServer({ action: 'processJaInputSheet', userId: profile.userId, docType: currentManualDocType }).then(function (result) {
    hideProcessing();
    alert(result.message);
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}
var JA_INPUT_SHEET_NAMES = {
  '市況速報': 'JA共選_市況速報_入力用', '荷受票': 'JA共選_荷受票_入力用',
  '精算通知書': 'JA共選_精算通知書_入力用', '売立案内書': 'JA共選_売立案内書_入力用'
};

function submitManualForm() {
  var config = MANUAL_FORM_CONFIGS[currentManualDocType];
  var headerData = {};
  config.headerFields.forEach(function (f) {
    var val = document.getElementById('manualHeader_' + f.key).value;
    headerData[f.key] = f.numeric ? Number(val) : val;
  });

  var entries = [];
  if (config.gridMode) {
    document.querySelectorAll('#gridTableWrap input').forEach(function (input) {
      if (input.value === '' || Number(input.value) === 0) return;
      entries.push({ grade: input.getAttribute('data-grade'), size: input.getAttribute('data-size'), value: Number(input.value) });
    });
  } else {
    var rows = Array.prototype.slice.call(document.getElementById('manualRows').children);
    entries = rows.map(function (rowEl) {
      var entry = {};
      Array.prototype.forEach.call(rowEl.querySelectorAll('input, select'), function (input) {
        var key = input.getAttribute('data-key');
        var field = config.rowFields.filter(function (f) { return f.key === key; })[0];
        entry[key] = field && field.numeric ? Number(input.value) : input.value;
      });
      return entry;
    }).filter(function (e) { return Object.keys(e).some(function (k) { return e[k] !== '' && e[k] !== 0; }); });
  }

  if (entries.length === 0) {
    alert('数量を1つ以上入力してください。');
    return;
  }

  var ok = confirm('この内容（' + entries.length + '件）で登録します。よろしいですか？');
  if (!ok) return;

  var payload = { action: config.submitAction, userId: profile.userId };
  if (currentManualDocType === '市況速報') {
    var prices = entries.map(function (e) { return { variety: headerData.variety, grade: e.grade, size: e.size, price: e.value }; });
    payload.reportDate = headerData.reportDate; payload.prices = prices;
  } else if (currentManualDocType === '荷受票') {
    var ukeoiEntries = entries.map(function (e) { return { grade: e.grade, size: e.size, boxes: e.value }; });
    payload.date = headerData.date; payload.memberCode = JA_FIXED_MEMBER_CODE;
    payload.producerName = JA_FIXED_PRODUCER_NAME; payload.variety = headerData.variety;
    payload.unitWeight = headerData.unitWeight; payload.entries = ukeoiEntries;
  } else if (currentManualDocType === '精算通知書') {
    payload.memberCode = JA_FIXED_MEMBER_CODE; payload.variety = headerData.variety; payload.settlements = entries;
  } else if (currentManualDocType === '売立案内書') {
    payload.sellDate = headerData.sellDate; payload.finalAmount = headerData.finalAmount; payload.items = entries;
  }

  showProcessing('登録中...');
  callServer(payload).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') setManualDocType(currentManualDocType);
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function onPhotoSelected() {
  var file = document.getElementById('photoInput').files[0];
  if (!file) return;
  selectedPhotoMimeType = file.type;
  var reader = new FileReader();
  reader.onload = function (e) {
    selectedPhotoBase64 = e.target.result.split(',')[1];
    var preview = document.getElementById('photoPreview');
    preview.src = e.target.result;
    preview.style.display = 'block';
    analyzeDocument();
  };
  reader.readAsDataURL(file);
}

function analyzeDocument() {
  showProcessing('AIが書類の種類を判定・読み取り中です...');
  callServer({ action: 'analyzeJaDocument', userId: profile.userId, photoBase64: selectedPhotoBase64, photoMimeType: selectedPhotoMimeType }).then(function (result) {
    hideProcessing();
    if (result.status !== 'ok') {
      alert(result.message);
      return;
    }
    currentAnalysis = result;
    renderPreview(result.docType, result.data);
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function renderPreview(docType, data) {
  var el = document.getElementById('previewContent');
  var html = '<span class="doc-type-label">' + docType + '</span>';

  if (docType === '市況速報') {
    html += '<p class="preview-meta">速報日付：' + data.reportDate + '（' + data.prices.length + '件）</p>';
    html += '<table class="preview-table"><tr><th>品種</th><th>等級</th><th>階級</th><th>単価</th></tr>';
    data.prices.forEach(function (p) {
      html += '<tr><td>' + p.variety + '</td><td>' + p.grade + '</td><td>' + p.size + '</td><td>' + p.price.toLocaleString() + '円</td></tr>';
    });
    html += '</table>';
  } else if (docType === '荷受票') {
    html += '<p class="preview-meta">選果年月日：' + data.date + '<br>組合員コード：' + data.memberCode + '　生産者名：' + (data.producerName || '-') + '<br>品種：' + data.variety + '　量目：' + data.unitWeight + 'kg/箱</p>';
    html += '<table class="preview-table"><tr><th>等級</th><th>階級</th><th>箱数</th><th>重さ</th><th>単価</th><th>仮金額</th></tr>';
    data.entries.forEach(function (e) {
      var priceCell = e.unitPrice !== null ? e.unitPrice.toLocaleString() + '円' : '<span class="no-price-note">未登録</span>';
      var amountCell = e.amount !== null ? '¥' + e.amount.toLocaleString() : '<span class="no-price-note">-</span>';
      html += '<tr><td>' + e.grade + '</td><td>' + e.size + '</td><td>' + e.boxes + '</td><td>' + e.weight + 'kg</td><td>' + priceCell + '</td><td>' + amountCell + '</td></tr>';
    });
    html += '</table>';
    if (data.entries.some(function (e) { return e.unitPrice === null; })) {
      html += '<p style="font-size:11px; color:#8B3A2E;">⚠ 単価が見つからない組み合わせがあります。先に市況速報を登録してから、この荷受票を登録し直すか、後で単価が揃った時に再計算してください。</p>';
    }
  } else if (docType === '精算通知書') {
    html += '<p class="preview-meta">組合員コード：' + data.memberCode + '　品種：' + data.variety + '</p>';
    html += '<table class="preview-table"><tr><th>選果年月日</th><th>階級</th><th>出荷量</th><th>単価</th><th>精算金額</th></tr>';
    data.settlements.forEach(function (s) {
      html += '<tr><td>' + s.date + '</td><td>' + s.size + '</td><td>' + s.weight + 'kg</td><td>' + s.unitPrice.toLocaleString() + '円</td><td>¥' + s.amount.toLocaleString() + '</td></tr>';
    });
    html += '</table>';
    html += '<p style="font-size:11px; color:#6B6048;">対応する荷受記録（同じ組合員コード・品種・選果年月日）を探して、金額を確定版に更新します。</p>';
  } else if (docType === '売立案内書') {
    html += '<p class="preview-meta">売立日：' + data.sellDate + '（丸統商事）</p>';
    html += '<table class="preview-table"><tr><th>品名</th><th>等級</th><th>階級</th><th>箱数</th><th>単価</th><th>金額</th></tr>';
    data.items.forEach(function (it) {
      html += '<tr><td>' + it.itemName + '</td><td>' + it.grade + '</td><td>' + it.size + '</td><td>' + it.boxes + '</td><td>' + it.unitPrice.toLocaleString() + '円</td><td>¥' + it.amount.toLocaleString() + '</td></tr>';
    });
    html += '</table>';
    html += '<p class="preview-meta">差引仕切金額：¥' + (data.finalAmount ? data.finalAmount.toLocaleString() : '-') + '</p>';
  }

  document.getElementById('previewContent').innerHTML = html;
  document.getElementById('previewCard').style.display = 'block';
}

function confirmSubmit() {
  var docType = currentAnalysis.docType;
  var data = currentAnalysis.data;
  var ok = confirm('この内容で登録します。よろしいですか？');
  if (!ok) return;

  showProcessing('登録中...');
  var payload;
  if (docType === '市況速報') {
    payload = { action: 'submitJaMarketPrices', userId: profile.userId, reportDate: data.reportDate, prices: data.prices };
  } else if (docType === '荷受票') {
    payload = {
      action: 'submitJaUkeoi', userId: profile.userId, date: data.date, memberCode: data.memberCode,
      producerName: data.producerName, variety: data.variety, unitWeight: data.unitWeight, entries: data.entries,
      photoBase64: selectedPhotoBase64, photoMimeType: selectedPhotoMimeType
    };
  } else if (docType === '精算通知書') {
    payload = { action: 'submitJaSettlement', userId: profile.userId, memberCode: data.memberCode, variety: data.variety, settlements: data.settlements };
  } else if (docType === '売立案内書') {
    payload = {
      action: 'submitMarutou', userId: profile.userId, sellDate: data.sellDate, items: data.items, finalAmount: data.finalAmount,
      photoBase64: selectedPhotoBase64, photoMimeType: selectedPhotoMimeType
    };
  }

  callServer(payload).then(function (result) {
    hideProcessing();
    alert(result.message);
    if (result.status === 'ok') cancelPreview();
  }).catch(function (err) {
    hideProcessing();
    alert('通信エラーが発生しました：' + (err && err.message ? err.message : err));
  });
}

function cancelPreview() {
  document.getElementById('previewCard').style.display = 'none';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoInput').value = '';
  selectedPhotoBase64 = null;
  selectedPhotoMimeType = null;
  currentAnalysis = null;
}

if (typeof liff === 'undefined') {
  document.getElementById('initStatus').className = 'status show error';
  document.getElementById('initStatus').textContent = 'LIFF SDKの読み込みに失敗しました。開き直してください。';
} else {
  showProcessing('読み込み中...しばらくお待ちください');
  withTimeout(liff.init({ liffId: LIFF_ID }), 10000).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('LOGIN_REDIRECT'); }
    return withTimeout(liff.getProfile(), 10000);
  }).then(function (p) {
    profile = p;
    currentIdToken = liff.getIDToken();
    return callServer({ action: 'checkAdmin', userId: p.userId });
  }).then(function (result) {
    hideProcessing();
    document.getElementById('initStatus').style.display = 'none';
    if (result.status === 'ok') {
      document.getElementById('mainContent').style.display = 'block';
      loadVarietyListForJa();
    } else {
      document.getElementById('blockedCard').style.display = 'block';
    }
  }).catch(function (err) {
    if (err === 'LOGIN_REDIRECT') return;
    var msg = (err && err.message) ? err.message : String(err);
    if (msg.indexOf('revoked') !== -1 || msg.indexOf('token') !== -1 || msg.indexOf('expired') !== -1) {
      try { liff.logout(); } catch (e) {}
      window.location.reload();
      return;
    }
    hideProcessing();
    var el = document.getElementById('initStatus');
    el.className = 'status show error';
    el.textContent = '初期化エラー：' + msg;
  });
}
</script>
